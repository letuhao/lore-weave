openapi: 3.0.3
info:
  title: LoreWeave Books API
  version: 1.5.0
  description: |
    Module 02 — books, chapters (MVP text/plain .txt uploads), editable chapter draft (UTF-8) with revision history,
    cover image, summary, and per-user storage usage. Multilingual: each locale is a separate chapter row with
    original_language; list chapters supports optional query filters original_language and/or sort_order and
    pagination (limit/offset/total). Owner list includes visibility for direct badge rendering in workspace.
    Logical delete: DELETE book/chapter moves to recycle bin (trashed); DELETE …/purge from bin marks purge_pending for
    future garbage collection (blobs + DB rows removed later by a batch job, not in this API). GET /v1/books lists active
    books only; GET /v1/books/trash lists trashed books. Trashed or purge_pending books must not appear in catalog/unlisted/public.
    Raw upload bytes remain in S3-compatible storage (e.g. MinIO); draft/revisions in Postgres until purged. Gateway-facing REST only.

servers:
  - url: http://localhost:3000
    description: API Gateway (BFF)

tags:
  - name: books
  - name: chapters
  - name: imports

paths:
  /v1/epub-imports/inspect:
    post:
      tags: [imports]
      summary: Upload and inspect an EPUB source without creating chapters
      operationId: inspectEpubImport
      description: >
        Retains the EPUB source for an authenticated user, validates the archive, and returns
        metadata, cover candidates, and an EPUB3-nav/NCX/spine-normalized navigation preview.
        This endpoint does not create a book, chapter, or import job.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: EPUB 2 or EPUB 3 source file, subject to deployment archive limits.
                target_book_id:
                  type: string
                  format: uuid
                  description: Optional existing target. When supplied, edit access is required.
      responses:
        '200':
          description: Valid source inspected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpubInspectionResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          description: EPUB is invalid, encrypted, or violates an archive safety limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/epub-imports:
    post:
      tags: [imports]
      summary: Start a structure-preserving EPUB import from an inspected source
      operationId: startEpubImport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartEpubImportRequest'
      responses:
        '202':
          description: Import job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpubImportJobAccepted'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Source/job state, duplicate source strategy, or explicit destructive confirmation is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/epub-imports/{source_id}/shadow-comparison:
    get:
      tags: [imports]
      summary: Read durable legacy-vs-V2 shadow comparison evidence
      operationId: getEpubShadowComparison
      security:
        - bearerAuth: []
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Shadow comparison for the retained source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpubShadowComparison'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /v1/import-jobs/{job_id}:
    get:
      tags: [imports]
      summary: Get EPUB import job status, progress, and allowed recovery actions
      operationId: getEpubImportJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportJobId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpubImportJob'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /v1/import-jobs/{job_id}/items:
    get:
      tags: [imports]
      summary: List normalized EPUB import items
      operationId: listEpubImportJobItems
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportJobId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EpubImportItemStatus'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/EpubImportRole'
        - name: q
          in: query
          schema:
            type: string
            maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpubImportJobItemsResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /v1/import-jobs/{job_id}/resume:
    post:
      tags: [imports]
      summary: Resume a failed or cancelled EPUB import job
      operationId: resumeEpubImportJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportJobId'
      responses:
        '202':
          description: Resume accepted; completed items are not processed again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpubImportJobActionResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /v1/import-jobs/{job_id}/cancel:
    post:
      tags: [imports]
      summary: Request safe cancellation of an EPUB import job
      operationId: cancelEpubImportJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportJobId'
      responses:
        '202':
          description: Cancellation request persisted; the active atomic item may finish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpubImportJobActionResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /v1/import-jobs/{job_id}/rollback:
    post:
      tags: [imports]
      summary: Roll back the job-owned effects of an EPUB import
      operationId: rollbackEpubImportJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                  enum: [true]
                  description: Explicit acknowledgement that job-owned import effects will be removed or deactivated.
      responses:
        '202':
          description: Rollback accepted or was already completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpubImportJobActionResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /v1/import-jobs/{job_id}/report:
    get:
      tags: [imports]
      summary: Get the durable EPUB import report
      operationId: getEpubImportJobReport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportJobId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpubImportReport'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /v1/books/storage-usage:
    get:
      tags: [books]
      summary: Storage used vs free tier quota for current user (book assets)
      operationId: getMyBookStorageUsage
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageUsageResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /v1/books:
    post:
      tags: [books]
      summary: Create book (shell — add chapters and cover separately)
      operationId: createBook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    get:
      tags: [books]
      summary: List active books for current user (excludes trashed and purge_pending)
      operationId: listMyBooks
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /v1/books/trash:
    get:
      tags: [books]
      summary: List books in recycle bin (lifecycle trashed only; not purge_pending)
      operationId: listTrashedBooks
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /v1/books/{book_id}:
    get:
      tags: [books]
      summary: Get book (owner) — active or trashed; purge_pending returns 404 until GC completes
      operationId: getBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [books]
      summary: Patch book metadata (owner) — title, description, original_language, summary
      operationId: patchBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBookRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Book is not active (e.g. trashed); restore before patching
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    delete:
      tags: [books]
      summary: Move book to recycle bin (logical delete stage 1); cascades all chapters to trashed
      operationId: trashBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '204':
          description: No Content — book and chapters are now trashed
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Invalid lifecycle (e.g. already trashed or purge_pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/books/{book_id}/restore:
    post:
      tags: [books]
      summary: Restore book from recycle bin to active; cascades chapters to active
      operationId: restoreBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Book is not in trashed state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/books/{book_id}/purge:
    delete:
      tags: [books]
      summary: Mark book for physical deletion (logical stage 2); cascades chapters to purge_pending; hidden from recycle bin UI
      operationId: purgeBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '204':
          description: No Content — eligible for future garbage collector
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Book must be trashed before purge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/books/{book_id}/cover:
    post:
      tags: [books]
      summary: Upload or replace book cover image (owner)
      operationId: uploadBookCover
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (e.g. image/jpeg, image/png); max size enforced by gateway.
      responses:
        '200':
          description: OK — cover replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '507':
          description: Insufficient storage / quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    delete:
      tags: [books]
      summary: Remove book cover (owner)
      operationId: deleteBookCover
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /v1/books/{book_id}/chapters:
    get:
      tags: [chapters]
      summary: List chapters for book (owner); optional filters by lifecycle_state, original_language, sort_order plus pagination
      operationId: listChapters
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: lifecycle_state
          in: query
          required: false
          description: >
            Filter by chapter lifecycle. Default active when parent book is active.
            When parent book is trashed, use trashed to list chapters in recycle-bin detail (all chapters are trashed with the book).
          schema:
            $ref: '#/components/schemas/LifecycleState'
          example: active
        - name: original_language
          in: query
          required: false
          description: Exact BCP-47 tag match; only chapters with this original_language are returned.
          schema:
            type: string
            maxLength: 35
        - name: sort_order
          in: query
          required: false
          description: Exact ordering slot; use with original_language to fetch one variant (e.g. chapter 1 in en).
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterListResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [chapters]
      summary: Create chapter by upload import (multipart) or editor-first JSON create
      operationId: createChapter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, original_language]
              properties:
                file:
                  type: string
                  format: binary
                  description: Must be .txt with Content-Type text/plain (enforced server-side).
                original_language:
                  type: string
                  maxLength: 35
                  description: BCP-47 tag for this chapter file (e.g. vi, zh-Hans); required for future translate workflows.
                title:
                  type: string
                  maxLength: 500
                sort_order:
                  type: integer
                  description: Optional ordering hint; default append to end.
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChapterFromEditorRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '507':
          description: Quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Parent book is not active (e.g. trashed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/books/{book_id}/chapters/bulk:
    post:
      tags: [chapters]
      summary: Create many plain-text chapters in one request (folder/large-import flow)
      description: >
        One chapter per item, no structural parse; imported chapters are published canon.
        Idempotent: an item whose original_filename already exists (active) in this book is skipped, not duplicated.
      operationId: bulkCreateChapters
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateChaptersRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCreateChaptersResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Parent book is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: More than 500 chapters in one request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '507':
          description: Quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/books/{book_id}/import:
    post:
      tags: [chapters]
      summary: Import a whole book file (.docx, .epub, .fb2, .md, .pdf, .txt) as chapters into an existing book
      description: >
        docs/specs/2026-07-06-pdf-book-import.md. .txt is parsed synchronously (source_format=plain)
        and returns the created chapter(s) directly. All other formats are stored and processed
        asynchronously by worker-infra — poll GET .../imports/{import_id} or listen on the
        `/ws` import-progress channel. For file_format=pdf with caption_images=true, model_source
        and model_ref are REQUIRED (Provider gateway invariant — no platform default vision model;
        the caller must explicitly pick a vision-capable BYOK model).
      operationId: startImport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: .txt, .docx, .epub, .fb2, .md, or .pdf — up to 200 MB.
                original_language:
                  type: string
                  maxLength: 35
                  description: BCP-47 tag (e.g. vi, zh-Hans). Defaults to "auto" when omitted.
                pages_per_chunk:
                  type: integer
                  minimum: 1
                  description: Required (and only read) when the file is a PDF — how many source pages become one chapter.
                caption_images:
                  type: boolean
                  description: PDF only. When true, model_source/model_ref become required.
                model_source:
                  type: string
                  description: PDF + caption_images only. BYOK provider source for the vision model (e.g. "user_model").
                model_ref:
                  type: string
                  description: PDF + caption_images only. The user_model_id (UUID) of the vision-capable model to caption images with.
      responses:
        '201':
          description: >
            .txt path only — synchronous. A single Chapter when the file has one part,
            or a BulkImportSummary when it decomposed into multiple parts/chapters.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Chapter'
                  - $ref: '#/components/schemas/BulkImportSummary'
        '202':
          description: .docx/.epub/.fb2/.md/.pdf — queued for async processing by worker-infra. FB2 metadata is retained with the import but does not overwrite existing book metadata.

  /v1/books/import/fb2:
    post:
      tags: [books, chapters]
      summary: Create a book and import an FB2 file
      description: >
        Creates a new book owned by the authenticated user and queues its FB2 source for
        asynchronous import. The worker preserves source hierarchy as chapters/scenes, projects
        title, annotation, language, genres, and cover image to the new book, and retains the
        complete supported FB2 metadata record with the import job.
      operationId: startNewFB2Import
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: .fb2 FictionBook 2.0/2.1/2.2-compatible XML — up to 200 MB.
                original_language:
                  type: string
                  maxLength: 35
                  description: Optional BCP-47 override. Otherwise the FB2 title-info language is used.
      responses:
        '202':
          description: New book created and FB2 import queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobAccepted'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Parent book is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '413':
          description: File exceeds the 200 MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '415':
          description: Unsupported file extension
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '507':
          description: Quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/books/{book_id}/import/pdf-peek:
    post:
      tags: [chapters]
      summary: Cheap synchronous page-count check for a PDF, before configuring pages_per_chunk
      description: >
        Called right after file select in the PDF import wizard. Rejects encrypted/corrupted PDFs
        with a 422 rather than letting the wizard proceed to a chunking step for an unusable file.
      operationId: pdfPeek
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file — up to 200 MB.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [page_count]
                properties:
                  page_count:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Parent book is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '413':
          description: File exceeds the 200 MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: PDF is encrypted, corrupted, or otherwise unreadable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: knowledge-service failed to inspect the PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/books/{book_id}/imports:
    get:
      tags: [chapters]
      summary: List recent import jobs for this book (most recent 20)
      operationId: listImportJobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobListResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'

  /v1/books/{book_id}/imports/{import_id}:
    get:
      tags: [chapters]
      summary: Get one import job's status/progress
      operationId: getImportJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
        - name: import_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /v1/books/{book_id}/chapters/{chapter_id}:
    get:
      tags: [chapters]
      summary: Get chapter metadata (owner)
      operationId: getChapter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/ChapterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [chapters]
      summary: Patch chapter metadata (title, sort_order, original_language) — owner
      operationId: patchChapter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/ChapterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchChapterRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Parent book not active or chapter not in a patchable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    delete:
      tags: [chapters]
      summary: Move chapter to recycle bin (logical delete stage 1); retains MinIO object, draft, and revisions until GC after purge
      operationId: trashChapter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/ChapterId'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Invalid lifecycle or parent book not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/books/{book_id}/chapters/{chapter_id}/restore:
    post:
      tags: [chapters]
      summary: Restore chapter from recycle bin (parent book must be active)
      operationId: restoreChapter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/ChapterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Chapter not trashed or parent book not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/books/{book_id}/chapters/{chapter_id}/purge:
    delete:
      tags: [chapters]
      summary: Mark chapter for physical deletion (stage 2); hidden from recycle bin; GC removes blobs and rows later
      operationId: purgeChapter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/ChapterId'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Chapter must be trashed before purge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/books/{book_id}/chapters/{chapter_id}/content:
    get:
      tags: [chapters]
      summary: Download original uploaded file bytes (owner) — not the edited draft; octet-stream or negotiated
      operationId: downloadChapterContent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/ChapterId'
      responses:
        '200':
          description: Raw file body
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /v1/books/{book_id}/chapters/{chapter_id}/draft:
    get:
      tags: [chapters]
      summary: Get canonical chapter draft for editor (owner) — UTF-8 working copy
      operationId: getChapterDraft
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/ChapterId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterDraftResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [chapters]
      summary: Update chapter draft and append a revision snapshot (owner)
      operationId: patchChapterDraft
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/ChapterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchChapterDraftRequest'
      responses:
        '200':
          description: OK — returns updated draft metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterDraftResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Draft conflict (e.g. optimistic concurrency) — optional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '413':
          $ref: '#/components/responses/ErrorResponse'

  /v1/books/{book_id}/chapters/{chapter_id}/revisions:
    get:
      tags: [chapters]
      summary: List chapter revision history (owner)
      operationId: listChapterRevisions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/ChapterId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterRevisionListResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /v1/books/{book_id}/chapters/{chapter_id}/revisions/{revision_id}:
    get:
      tags: [chapters]
      summary: Get one revision snapshot including body (owner)
      operationId: getChapterRevision
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/ChapterId'
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterRevisionDetail'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /v1/books/{book_id}/chapters/{chapter_id}/revisions/{revision_id}/restore:
    post:
      tags: [chapters]
      summary: Restore current draft from a past revision (owner); creates a new revision capturing prior draft
      operationId: restoreChapterRevision
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/ChapterId'
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterDraftResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BookId:
      name: book_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChapterId:
      name: chapter_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionId:
      name: revision_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportJobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ErrorResponse:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

  schemas:
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    EpubImportWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - navigation_missing_spine_fallback
            - navigation_anchor_missing
            - navigation_range_ambiguous
            - navigation_node_non_content
            - unsupported_resource
            - asset_missing
            - asset_invalid_mime
            - internal_link_target_missing
            - metadata_conflict
            - composition_materialization_failed
            - rollback_conflict_user_modified
        message:
          type: string
        source_key:
          type: string
          nullable: true

    EpubImportErrorCode:
      type: string
      enum:
        - import_source_missing
        - epub_invalid_archive
        - epub_mimetype_invalid
        - epub_container_missing
        - epub_opf_invalid
        - epub_drm_unsupported
        - epub_archive_path_invalid
        - epub_archive_limit_exceeded
        - epub_navigation_invalid
        - epub_item_processing_failed
        - import_cancelled
        - import_state_conflict

    EpubNavigationSource:
      type: string
      enum: [epub3-nav, epub2-ncx, spine-fallback]

    EpubImportRole:
      type: string
      enum: [volume, part, chapter, section, frontmatter, backmatter, appendix, unknown]

    EpubImportItemStatus:
      type: string
      enum: [pending, claimed, staged, completed, skipped, failed, cancelled]

    EpubImportJobStatus:
      type: string
      enum:
        - queued
        - processing
        - import_staging
        - import_ready
        - completed
        - completed_with_warnings
        - import_failed
        - cancelled
        - rolling_back
        - rolled_back

    EpubContentRange:
      type: object
      required: [href]
      properties:
        href:
          type: string
        start_anchor:
          type: string
          nullable: true
        end_anchor:
          type: string
          nullable: true

    EpubNavigationNode:
      type: object
      required: [source_key, ordinal, depth, role, title, selected]
      properties:
        source_key:
          type: string
          description: Stable source SHA-256 plus normalized href/fragment identity.
        source_href:
          type: string
          nullable: true
        source_fragment:
          type: string
          nullable: true
        parent_source_key:
          type: string
          nullable: true
        ordinal:
          type: integer
          minimum: 0
        depth:
          type: integer
          minimum: 0
        role:
          $ref: '#/components/schemas/EpubImportRole'
        title:
          type: string
        linear:
          type: boolean
        selected:
          type: boolean
        content_ranges:
          type: array
          items:
            $ref: '#/components/schemas/EpubContentRange'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EpubImportWarning'
        children:
          type: array
          items:
            $ref: '#/components/schemas/EpubNavigationNode'

    EpubCoverCandidate:
      type: object
      required: [source_path, media_type, size_bytes]
      properties:
        source_path:
          type: string
        media_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        source_method:
          type: string
          enum: [epub3-cover-image, epub2-meta-cover, guide-cover, filename-fallback]

    EpubInspectionResponse:
      type: object
      required: [source_id, sha256, metadata, navigation_source, structure, warnings, limits]
      properties:
        source_id:
          type: string
          format: uuid
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        duplicate_source:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
        cover:
          allOf:
            - $ref: '#/components/schemas/EpubCoverCandidate'
          nullable: true
        navigation_source:
          $ref: '#/components/schemas/EpubNavigationSource'
        structure:
          type: array
          items:
            $ref: '#/components/schemas/EpubNavigationNode'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EpubImportWarning'
        limits:
          type: object
          additionalProperties:
            type: integer

    EpubShadowComparison:
      type: object
      required: [legacy_chapter_count, v2_chapter_count, delta, legacy_projection, differences]
      properties:
        legacy_chapter_count:
          type: integer
          minimum: 0
        v2_chapter_count:
          type: integer
          minimum: 0
        delta:
          type: integer
        legacy_projection:
          type: string
          enum: [linear_content_document_order]
        differences:
          type: array
          items:
            type: string

    EpubImportTarget:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [existing_book, new_book]
        book_id:
          type: string
          format: uuid
          nullable: true
          description: Required when mode is existing_book and omitted when mode is new_book.

    EpubMetadataPolicy:
      type: object
      properties:
        title:
          type: string
          enum: [use_source, keep_existing, edit_manually]
        authors:
          type: string
          enum: [use_source, keep_existing, merge, edit_manually]
        language:
          type: string
          enum: [use_source, keep_existing, edit_manually]
        description:
          type: string
          enum: [use_source, keep_existing, merge, edit_manually]
        cover:
          type: string
          enum: [use_source, keep_existing]

    EpubImportOptions:
      type: object
      properties:
        preserve_hierarchy:
          type: boolean
          default: true
        import_images:
          type: boolean
          default: true
        import_footnotes:
          type: boolean
          default: true
        retain_source:
          type: boolean
          default: true

    StartEpubImportRequest:
      type: object
      required: [source_id, target, strategy, metadata_policy, options]
      properties:
        source_id:
          type: string
          format: uuid
        target:
          $ref: '#/components/schemas/EpubImportTarget'
        strategy:
          type: string
          enum: [append, replace_all, merge_by_source_key]
        destructive_confirmation:
          type: boolean
          description: Required and true when strategy is replace_all.
        metadata_policy:
          $ref: '#/components/schemas/EpubMetadataPolicy'
        selected_source_keys:
          type: array
          description: Empty means all selectable leaf items from the inspection.
          items:
            type: string
        title_overrides:
          type: object
          additionalProperties:
            type: string
        options:
          $ref: '#/components/schemas/EpubImportOptions'

    EpubImportJobAccepted:
      type: object
      required: [job_id, source_id, status]
      properties:
        job_id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]

    EpubImportProgress:
      type: object
      required: [total, completed, failed]
      properties:
        total:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        current_source_key:
          type: string
          nullable: true
        assets_imported:
          type: integer
          minimum: 0

    EpubImportJob:
      type: object
      required: [job_id, source_id, status, progress, warnings, created_at, updated_at, resumable, cancellable, rollback_available]
      properties:
        job_id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        book_id:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/EpubImportJobStatus'
        progress:
          $ref: '#/components/schemas/EpubImportProgress'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EpubImportWarning'
        error_code:
          allOf:
            - $ref: '#/components/schemas/EpubImportErrorCode'
          nullable: true
        error_message:
          type: string
          nullable: true
        resumable:
          type: boolean
        cancellable:
          type: boolean
        rollback_available:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finalized_at:
          type: string
          format: date-time
          nullable: true

    EpubImportJobItem:
      type: object
      required: [item_id, source_key, ordinal, depth, role, title, selected, status]
      properties:
        item_id:
          type: string
          format: uuid
        source_key:
          type: string
        source_href:
          type: string
          nullable: true
        source_fragment:
          type: string
          nullable: true
        parent_source_key:
          type: string
          nullable: true
        ordinal:
          type: integer
          minimum: 0
        depth:
          type: integer
          minimum: 0
        role:
          $ref: '#/components/schemas/EpubImportRole'
        title:
          type: string
        selected:
          type: boolean
        status:
          $ref: '#/components/schemas/EpubImportItemStatus'
        chapter_id:
          type: string
          format: uuid
          nullable: true
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EpubImportWarning'
        error_code:
          allOf:
            - $ref: '#/components/schemas/EpubImportErrorCode'
          nullable: true

    EpubImportJobItemsResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EpubImportJobItem'
        total:
          type: integer
          minimum: 0

    EpubImportJobActionResponse:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/EpubImportJobStatus'
        chapters_rolled_back:
          type: integer
          minimum: 0
          description: Present for rollback responses; counts chapters safely removed by this call.
        conflicts:
          type: array
          description: Chapters retained because they changed after import finalization.
          items:
            type: object
            required: [chapter_id, code]
            properties:
              chapter_id:
                type: string
                format: uuid
              code:
                type: string
                enum: [rollback_conflict_user_modified]

    EpubImportReport:
      type: object
      required: [job_id, source_id, status, chapters_detected, chapters_selected, chapters_created, chapters_skipped, assets_detected, assets_imported, warnings, errors, navigation_source, metadata_applied, duration_ms]
      properties:
        job_id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/EpubImportJobStatus'
        chapters_detected:
          type: integer
          minimum: 0
        chapters_selected:
          type: integer
          minimum: 0
        chapters_created:
          type: integer
          minimum: 0
        chapters_active:
          type: integer
          minimum: 0
          description: Imported chapters still active after any completed rollback.
        chapters_rolled_back:
          type: integer
          minimum: 0
        chapters_skipped:
          type: integer
          minimum: 0
        assets_detected:
          type: integer
          minimum: 0
        assets_imported:
          type: integer
          minimum: 0
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EpubImportWarning'
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code:
                $ref: '#/components/schemas/EpubImportErrorCode'
              message:
                type: string
              source_key:
                type: string
                nullable: true
        navigation_source:
          $ref: '#/components/schemas/EpubNavigationSource'
        metadata_applied:
          type: array
          items:
            type: string
        duration_ms:
          type: integer
          minimum: 0

    LifecycleState:
      type: string
      enum: [active, trashed, purge_pending]
      description: >
        active — normal workspace; trashed — recycle bin (logical delete stage 1);
        purge_pending — user removed from bin (stage 2); data kept until garbage collector deletes storage and rows.

    StorageUsageResponse:
      type: object
      required: [used_bytes, quota_bytes]
      properties:
        used_bytes:
          type: integer
          minimum: 0
          description: Bytes used by this user's book covers and chapter uploads.
        quota_bytes:
          type: integer
          minimum: 0
          description: Free-tier quota; paid tiers are future roadmap.

    BookCover:
      type: object
      required: [content_type, byte_size, download_url]
      properties:
        content_type:
          type: string
          example: image/jpeg
        byte_size:
          type: integer
          minimum: 0
        download_url:
          type: string
          description: Time-limited signed URL or gateway path for owner/catalog as policy allows.

    CreateBookRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          maxLength: 8000
        original_language:
          type: string
          maxLength: 35
          description: BCP-47 source language for the work (translate/RAG defaults); replaces former primary_language.
        summary:
          type: string
          maxLength: 32000
          description: User-authored synopsis; AI-assisted generation is out of scope for MVP.

    PatchBookRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          maxLength: 8000
        original_language:
          type: string
          maxLength: 35
        summary:
          type: string
          maxLength: 32000

    Book:
      type: object
      required: [book_id, owner_user_id, title, lifecycle_state, created_at, updated_at]
      properties:
        book_id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        original_language:
          type: string
          description: BCP-47; same semantics as former primary_language field.
        summary:
          type: string
        cover:
          allOf:
            - $ref: '#/components/schemas/BookCover'
          nullable: true
        chapter_count:
          type: integer
          minimum: 0
        visibility:
          type: string
          enum: [private, unlisted, public]
          description: Owner-facing sharing state for list/detail rendering convenience.
        lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'
        trashed_at:
          type: string
          format: date-time
          nullable: true
          description: When the book entered the recycle bin; null when active.
        purge_eligible_at:
          type: string
          format: date-time
          nullable: true
          description: When the user requested permanent deletion from the bin; GC uses this; null until stage 2.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Chapter:
      type: object
      required:
        - chapter_id
        - book_id
        - original_filename
        - original_language
        - content_type
        - byte_size
        - sort_order
        - lifecycle_state
        - created_at
        - updated_at
      properties:
        chapter_id:
          type: string
          format: uuid
        book_id:
          type: string
          format: uuid
        title:
          type: string
        original_filename:
          type: string
        original_language:
          type: string
          maxLength: 35
          description: BCP-47 for this chapter's uploaded/edited content; user may upload another chapter row per language.
        content_type:
          type: string
          example: text/plain
        byte_size:
          type: integer
          minimum: 0
          description: Size of original uploaded object in storage (not draft text length).
        sort_order:
          type: integer
        draft_updated_at:
          type: string
          format: date-time
          description: When canonical draft text was last saved (if applicable).
        draft_revision_count:
          type: integer
          minimum: 0
          description: Number of stored revision snapshots for this chapter.
        lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'
        trashed_at:
          type: string
          format: date-time
          nullable: true
        purge_eligible_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BulkCreateChaptersRequest:
      type: object
      required: [chapters]
      properties:
        chapters:
          type: array
          maxItems: 500
          items:
            type: object
            required: [original_filename, content]
            properties:
              original_filename:
                type: string
              content:
                type: string
              title:
                type: string
        original_language:
          type: string
          maxLength: 35
          description: BCP-47 tag applied to every chapter in this batch. Defaults to "auto" when omitted.

    BulkCreateChaptersResponse:
      type: object
      required: [chapters_created, skipped_existing, book_id]
      properties:
        chapters_created:
          type: integer
          minimum: 0
        skipped_existing:
          type: integer
          minimum: 0
          description: Items skipped because original_filename already exists (active) in this book — re-running a partially-failed batch is idempotent.
        book_id:
          type: string
          format: uuid

    BulkImportSummary:
      type: object
      required: [chapters_created, book_id]
      description: Returned by POST .../import (text path) when the file decomposed into more than one chapter.
      properties:
        chapters_created:
          type: integer
          minimum: 0
        book_id:
          type: string
          format: uuid

    ImportJobAccepted:
      type: object
      required: [id, book_id, status, filename, file_size, created_at]
      properties:
        id:
          type: string
          format: uuid
        book_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]
        filename:
          type: string
        file_size:
          type: integer
          minimum: 0
        created_at:
          type: string

    ImportJob:
      type: object
      required: [id, book_id, status, filename, file_format, file_size, chapters_created, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        book_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, completed, failed]
        filename:
          type: string
        file_format:
          type: string
          enum: [docx, epub, fb2, markdown, pdf]
        file_size:
          type: integer
          minimum: 0
        chapters_created:
          type: integer
          minimum: 0
        error:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        completed_at:
          type: string
          nullable: true

    ImportJobListResponse:
      type: object
      required: [imports]
      properties:
        imports:
          type: array
          items:
            $ref: '#/components/schemas/ImportJob'

    PatchChapterRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 500
        sort_order:
          type: integer
        original_language:
          type: string
          maxLength: 35

    ChapterDraftResponse:
      type: object
      required: [chapter_id, body, draft_format, draft_updated_at]
      properties:
        chapter_id:
          type: string
          format: uuid
        body:
          type: string
          description: Canonical UTF-8 draft text for the editor.
        draft_format:
          type: string
          enum: [plain, markdown]
          description: MVP default plain; markdown is optional product toggle.
        draft_updated_at:
          type: string
          format: date-time
        draft_version:
          type: integer
          minimum: 0
          nullable: true
          description: Optional monotonic token for optimistic concurrency; null if server does not expose it.

    PatchChapterDraftRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: Full replacement UTF-8 draft body.
        commit_message:
          type: string
          maxLength: 500
          description: Optional revision label shown in history.
        expected_draft_version:
          type: integer
          minimum: 0
          description: If provided and stale, server may respond 409 CHAPTER_DRAFT_CONFLICT.

    ChapterRevisionSummary:
      type: object
      required: [revision_id, chapter_id, created_at]
      properties:
        revision_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        author_user_id:
          type: string
          format: uuid
        message:
          type: string
        body_byte_length:
          type: integer
          minimum: 0

    ChapterRevisionDetail:
      type: object
      required: [revision_id, chapter_id, created_at, body]
      properties:
        revision_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        author_user_id:
          type: string
          format: uuid
        message:
          type: string
        body:
          type: string
          description: Snapshot of draft at revision time (UTF-8).

    ChapterRevisionListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChapterRevisionSummary'
        total:
          type: integer
          minimum: 0

    ChapterListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    CreateChapterFromEditorRequest:
      type: object
      required: [original_language]
      properties:
        title:
          type: string
          maxLength: 500
        original_language:
          type: string
          maxLength: 35
          description: BCP-47 tag; required for editor-first chapter creation.
        sort_order:
          type: integer
          description: Optional ordering hint; default append to end.
        body:
          type: string
          description: Optional initial draft body for editor-first flow; defaults to empty string when omitted.

    BookListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        total:
          type: integer
          minimum: 0
