openapi: 3.1.0
info:
  title: world-service — reality provisioning (internal)
  version: "1.0.0"
  description: |
    The internal HTTP surface of `services/world-service`. Frozen before the routes
    were written (contract-first, CLAUDE.md), and machine-checked against the real
    router by `route_conformance` in `services/world-service/tests/` — an
    undocumented versioned route and a documented-but-unrouted path both fail the
    build. That test exists because `contracts/.spectral.yaml` is NOT WIRED
    (DEFERRED 078), so a frozen YAML on its own buys no enforcement.

    **This surface is INTERNAL.** Invariant I1 puts all external traffic through
    `api-gateway-bff`; every versioned route here is gated on the `X-Internal-Token`
    header (`service_http::require_internal`) and is not reachable by an end user.
    The probes are deliberately ungated — a docker healthcheck and a load balancer
    hit them without credentials.

    Provisioning is not a new capability. `admin-cli`'s `reality provision` command
    already reaches the same library path by exec'ing the `provision` worker binary;
    this route is a second invoker shape over `Provisioner::provision_reality`, not
    a reimplementation of it.

servers:
  - url: http://world-service:7120
    description: in-cluster, service-to-service only

tags:
  - name: probes
    description: Liveness / readiness / metrics. Unauthenticated by design.
  - name: actor-control
    description: |
      Who drives which actor, in which reality (`SEALED-BINDING`, migration 034).
      A player is not a KIND of actor — it is a CONTROL INTERFACE — so these
      operations are about the BINDING, never about a character's lifecycle.
  - name: realities
    description: Per-reality database provisioning.

paths:
  /livez:
    get:
      tags: [probes]
      summary: Process liveness
      description: 200 for as long as the binary runs. Does not touch the database.
      responses:
        "200": { $ref: "#/components/responses/Health" }

  /readyz:
    get:
      tags: [probes]
      summary: Readiness
      description: Pings the meta Postgres pool. 503 when the database is unreachable.
      responses:
        "200": { $ref: "#/components/responses/Health" }
        "503": { $ref: "#/components/responses/Health" }

  /metrics:
    get:
      tags: [probes]
      summary: Prometheus text exposition
      responses:
        "200":
          description: metrics
          content:
            text/plain:
              schema: { type: string }

  /internal/v1/realities:
    post:
      tags: [realities]
      summary: Provision a reality
      description: |
        Runs the 11-step provisioning flow: validate → pick a shard under a
        per-shard advisory lock → register pending → CREATE DATABASE → apply every
        migration in `contracts/migrations/manifest.yaml` → pgbouncer → Prometheus →
        backup policy → provisioning→seeding→active.

        **Idempotent.** Re-posting the same `reality_id` re-enters the flow and
        reports each already-complete step as `skipped` rather than failing. This is
        the property `1b14-01` was filed against, so it is asserted against the live
        path rather than a fake.

        Capacity is read live from `shard_utilization` + `reality_registry`; the
        pick→register critical section holds an advisory lock, which is what closes
        the TOCTOU that the `provision-drill` binary never exercised because it
        fabricated its snapshot.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProvisionRequest" }
      responses:
        "201":
          description: |
            `outcome: provisioned` — no registry row existed, so the reality was
            placed under the advisory lock and all 11 steps ran.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisionResponse" }
        "200":
          description: |
            Nothing was created. Either `outcome: resumed` — a row existed in a
            live state (`provisioning`/`seeding`) and the flow re-entered pinned
            to the shard the registry names, reporting each already-complete step
            as `skipped` — or `outcome: already_provisioned`, where the reality
            has moved past provisioning and no steps ran at all.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisionResponse" }
        "400":
          description: The request failed validation (nil `reality_id`, empty `locale` or `reason`, `deploy_cohort` > 99), or the body was not readable JSON.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401":
          description: Missing or mismatched `X-Internal-Token`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: No shard has capacity, or a concurrent transition means the caller must reload and decide rather than blind-retry.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: The body was valid JSON but not a `ProvisionRequest` (a missing or mistyped field).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "500":
          description: A provisioning effect failed (bridge, shard, or migration). The detail is logged, not returned.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "504":
          description: The request exceeded the 300s ceiling.

  /internal/v1/actors:
    post:
      tags: [actor-control]
      summary: Create (or adopt) an actor in a reality
      description: |
        The per-reality actor registry — `S-9`'s missing conversion site, and
        the precondition `actor_control_binding` has assumed since migration
        `034` without it existing.

        The registry ALLOCATES `entity_id` (the island's `sim-core::EntityId`)
        so that it is the source of truth for that number rather than a second
        copy of one the island also assigns. Supply `entity_id` explicitly only
        to ADOPT an entity that already exists in a running island.

        This mints no new vocabulary and is not a fifth spelling of
        who-is-acting under `SF-6`: it writes down the mapping between two
        spellings that already exist, which is the conversion site `S-9`
        measured as having zero instances.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateActorRequest" }
      responses:
        "201":
          description: The actor exists and carries both identities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateActorResponse" }
        "400":
          description: The reality is not registered, or the entity id is taken.
          $ref: "#/components/responses/Problem"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/v1/actor-control/grant:
    post:
      tags: [actor-control]
      summary: Grant a user control of an actor
      description: |
        Creates the live binding `(user_ref_id, reality_id, actor_id)`. The write
        goes through the Go meta-write bridge so the `meta_write_audit` row and
        the `actor.control.granted` outbox event land in the SAME transaction as
        the binding (`I8`).

        **One live driver per actor.** Enforced by a partial unique index over
        the non-revoked rows (migration `041`). A grant for an actor somebody
        else drives is a `409` and never an idempotent `200`: a second principal
        claiming a subject is not a retry, and reporting it as success would
        hide the confused-deputy refusal from the caller.

        A handoff is therefore **revoke, then grant** — which is also what keeps
        the event names honest, because a grant is an INSERT and a revoke is an
        UPDATE.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantControlRequest" }
      responses:
        "201":
          description: "`outcome: granted` — a new live binding was created."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlResponse" }
        "200":
          description: |
            `outcome: already_granted` — this same user already holds the live
            binding. Idempotent: a retried grant carries the identical intent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlResponse" }
        "400":
          description: |
            The actor does not exist in this reality. A binding to an actor with
            no durable identity is the dangling pointer `S-9` describes, so the
            grant refuses at the write edge rather than leaving a resolver to
            discover it at turn time.
          $ref: "#/components/responses/Problem"
        "409":
          description: |
            A DIFFERENT user holds the live binding. Revoke first; do not
            blind-retry.
          $ref: "#/components/responses/Problem"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/v1/actor-control/revoke:
    post:
      tags: [actor-control]
      summary: End the live binding for an actor
      description: |
        Sets `revoked_at` on the live row. The actor lives on — only the binding
        ends, which is why this is a timestamp and not a status enum
        (migration `034` dropped its predecessor's enum after finding five of
        its six members belonged to the transport, to `GoneState`, or to user
        preferences).

        Keyed by the ACTOR, not by the user: the invariant is one live driver
        per actor, so the actor is what names the row. `expected_user_ref_id` is
        an optional compare-and-set — send it when acting on a character list
        that may be stale, or the revoke will remove whoever took over instead.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeControlRequest" }
      responses:
        "200":
          description: |
            `outcome: revoked` — a live binding was ended. Or
            `outcome: already_revoked` — there was none, which is the end state
            the caller asked for. Idempotent by END STATE; the body says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlResponse" }
        "409":
          description: |
            `expected_user_ref_id` no longer holds the binding. Reload and
            decide — a stale caller must surface, never blind-retry.
          $ref: "#/components/responses/Problem"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/v1/actor-control/subject:
    post:
      tags: [actor-control]
      summary: Which actor does this user drive in this reality?
      description: |
        The OWNER-SCOPED read — the answer to "which actor do I drive", never
        "who drives this actor". Those are different tiers:
        `contracts/meta/meta-sensitive-read-paths.yml` registers the cross-user
        direction as `actor_binding_cross_user` and describes it, verbatim, as
        `WHERE user_ref_id != $caller_user`. This route is the `=` side, so it
        writes no `meta_read_audit` row.

        Its caller is `game-server`, which has no Postgres client and must not
        grow one (`I3`: TypeScript is gateway/realtime). Before this existed the
        transport mapped users to entities from `LW_CHANNEL_ACTOR_MAP`, an env
        var — so a human could only drive an actor if an operator edited the
        environment and restarted the process.

        Internal-gated like the writers, and for a sharper reason: the request
        NAMES the user it asks about, so on a public edge `user_ref_id` would be
        an oracle. The client never names its own subject (`SEALED-SUBJECT`);
        the transport takes it from the redeemed WS ticket.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubjectRequest" }
      responses:
        "200":
          description: |
            The question has an answer — INCLUDING "nobody". `self: null` is the
            ordinary state for a spectator and for the instant after a revoke,
            so it is a 200 with a null rather than a 404: the resource being
            described is the binding relation, and "there is no live binding"
            is a fact about it, not its absence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubjectResponse" }
        "400":
          description: |
            Reserved for the three cases where `self: null` would be a LIE:
            the reality is not registered (a typo — answering "you drive
            nobody" about a world that does not exist is the bug the revoke
            path shipped once); the reality does not accept commands (frozen,
            archived, provisioning — hop 2 needs a `dp::RealityId`, which only
            a passing control-plane bind produces); or the live binding names
            an actor this reality's registry has no row for, which is the
            dangling pointer `S-9` describes and must not read as spectating.
          $ref: "#/components/responses/Problem"
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Shared service-to-service token. Byte-exact match; see `service_http::require_internal`.

  responses:
    Health:
      description: probe result
      content:
        application/json:
          schema:
            type: object
            required: [status, endpoint]
            properties:
              status: { type: string, enum: [ok, degraded] }
              endpoint: { type: string, enum: [livez, readyz] }

  schemas:
    CreateActorRequest:
      type: object
      additionalProperties: false
      required: [reality_id]
      properties:
        reality_id: { type: string, format: uuid }
        entity_id:
          type: integer
          format: int64
          description: |
            Omit to let the registry allocate. Supply only to adopt an entity
            the island already has.
    CreateActorResponse:
      type: object
      required: [reality_id, actor_id, entity_id]
      properties:
        reality_id: { type: string, format: uuid }
        actor_id:
          type: string
          format: uuid
          description: The PLATFORM identity — what a binding points at.
        entity_id:
          type: integer
          format: int64
          description: The ISLAND identity — what the simulation acts on.
    GrantControlRequest:
      type: object
      additionalProperties: false
      required: [user_ref_id, reality_id, actor_id]
      properties:
        user_ref_id:
          type: string
          format: uuid
          description: WHO drives. Opaque; carries no PII on its own.
        reality_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
          description: |
            The per-reality actor identity. Its FK lives in the per-reality
            database, so it is deliberately unconstrained in the meta table.
        reason:
          type: string
          description: Recorded on the `meta_write_audit` row.
    RevokeControlRequest:
      type: object
      additionalProperties: false
      required: [reality_id, actor_id]
      properties:
        reality_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        expected_user_ref_id:
          type: string
          format: uuid
          description: |
            Optional CAS. When present the revoke applies only while this user
            still holds the binding; otherwise 409.
        reason:
          type: string
    SubjectRequest:
      type: object
      additionalProperties: false
      required: [reality_id, user_ref_id]
      properties:
        reality_id:
          type: string
          format: uuid
        user_ref_id:
          type: string
          format: uuid
          description: |
            WHOSE binding to resolve. The transport takes this from the redeemed
            WS ticket, never from anything the client sent.
    SubjectResponse:
      type: object
      required: [reality_id, user_ref_id, self]
      properties:
        reality_id: { type: string, format: uuid }
        user_ref_id: { type: string, format: uuid }
        self:
          type: [object, "null"]
          required: [actor_id, entity_id]
          description: |
            `null` when this user drives nobody here. Present and non-null is
            the only shape that authorises acting.
          properties:
            actor_id:
              type: string
              format: uuid
              description: |
                The PLATFORM identity. Returned because this is the caller's own
                binding — no cross-user disclosure — and it is the durable id an
                operator greps when someone reports the wrong character.
            entity_id:
              type: integer
              format: int64
              minimum: 0
              description: |
                The ISLAND identity — what the simulation acts on, and what the
                transport needs. Non-negative: `sim_core::EntityId` is a `u64`,
                and a negative BIGINT cast into one names an entity that does
                not exist. Refused at both edges rather than cast.
    ControlResponse:
      type: object
      required: [outcome, reality_id, actor_id]
      properties:
        outcome:
          type: string
          enum: [granted, already_granted, revoked, already_revoked]
        reality_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
    ProvisionRequest:
      type: object
      required: [reality_id, locale, deploy_cohort, reason]
      description: Mirrors `world_service::provisioner::ProvisionRequest` field-for-field.
      properties:
        reality_id:
          type: string
          format: uuid
          description: |
            Caller-generated, so the audit chain stays coherent across the retry of a
            request whose response was lost. The nil UUID is refused.
        locale:
          type: string
          description: BCP-47 (`en`, `en-US`, `ja-JP`). Must be non-empty.
          example: en-US
        deploy_cohort:
          type: integer
          minimum: 0
          maximum: 99
          description: Deploy canary cohort (SR05 §12AH.4).
        reason:
          type: string
          description: Written into the MetaWrite audit trail. Must be non-empty.
          example: operator provisioned via world-service HTTP
        owner_user_id:
          type: [string, "null"]
          format: uuid
          description: |
            The user who owns this reality, or `null` for a platform-owned one. `null`
            is a real category, not "unknown" — the bridge derives `owner_kind` from
            it, so the registry's (kind, owner) pair is consistent by construction.
            The nil UUID is refused; use `null`.

    ProvisionResponse:
      type: object
      required: [outcome, reality_id, shard_id, db_name]
      description: |
        Mirrors `world_service::server::handlers::ProvisionResponse`, which wraps
        `provisioner::ProvisionReport` with the outcome discriminant. The three
        outcomes are the three states a caller can be in and **none of them is an
        error** — re-posting the same `reality_id` is safe.
      properties:
        outcome:
          type: string
          enum: [provisioned, resumed, already_provisioned]
        reality_id: { type: string, format: uuid }
        shard_id:
          type: string
          description: The shard the reality lives on.
          example: pg-shard-0.internal
        db_name:
          type: string
          description: "Convention: `lw_reality_<first-12-hex>`."
          example: lw_reality_cd0747d24b94
        status:
          type: string
          description: |
            Present **only** for `already_provisioned` — the lifecycle status that
            is the reason nothing was done.
          example: active
        steps:
          type: array
          description: |
            All 11 steps in order. **Absent** for `already_provisioned`, because no
            steps ran; an empty array would claim a run that did not happen.
          items: { $ref: "#/components/schemas/StepOutcome" }

    StepOutcome:
      type: object
      required: [outcome, step]
      description: |
        Serde-tagged enum (`tag = "outcome"`, `content = "step"`). `skipped` means an
        idempotent re-entry found the step already complete; `done` means it executed
        on this call.
      properties:
        outcome: { type: string, enum: [done, skipped] }
        step:
          type: string
          enum:
            - validate
            - pick_shard
            - register_pending
            - create_database
            - apply_migrations
            - register_with_pgbouncer
            - register_prometheus_scrape
            - register_backup_policy
            - transition_to_seeding
            - transition_to_active
            - emit_reality_created

    ProblemDetails:
      type: object
      description: RFC 7807, as rendered by `service_http::ProblemDetails`.
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        message:
          type: string
          description: Frontend-readable message; the repo's RFC 7807 extension.
