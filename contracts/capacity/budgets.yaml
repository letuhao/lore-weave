  # The Rust writer node: hosts sim-core natively (CS-A5) and commits through an
  # epoch-fenced ChannelWriter.
  #
  # THE SCALING FACT THAT MATTERS, because it is not the usual one: a replica
  # holds a WRITER LEASE per (reality, channel) (DP-A16). Replicas therefore do
  # NOT share a channel — adding one serves MORE channels, it does not make a
  # single channel faster. So `max_replicas` is a bound on concurrent channels,
  # not on throughput, and raising it to chase latency on one busy reality will
  # do nothing at all.
  #
  # Memory is dominated by resident island state, not by the rules: a `Ruleset`
  # is ~1.3 KB and is interned ONCE PER REALITY (QTY-A6.1 puts O(n²) tables on
  # the ruleset and O(n) on the actor precisely so this stays true), while an
  # `Actor` is 192 B — ten thousand resident actors are ~2 MB.
  #
  # ⚠ THESE NUMBERS ARE UNVALIDATED. Zero production realities exist, so nothing
  # here has been observed under load; they are a defensible starting point sized
  # against world-service, not a measurement. The one measured figure is the step
  # cost — 176 ns/step, ~5.7M steps/sec on a single island (release), recorded in
  # docs/plans/2026-07-26-sim-core-s1a.md — which says CPU is not the binding
  # constraint at any plausible V1 load. Re-derive from real traffic before this
  # is used to size a cluster.
  - name: commit-service
    class: worker
    v1: { min_replicas: 1, max_replicas: 4, cpu_per_replica: 1.0, memory_per_replica: 2Gi, scale_trigger: "proposal_stream_lag>200" }
    v3: { min_replicas: 2, max_replicas: 16 }
