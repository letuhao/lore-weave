# contracts/migrations/manifest.yaml — L1.D.5 (RAID cycle 6)
#
# Ordered declarative manifest of every per-reality schema migration the
# orchestrator (services/migration-orchestrator) may apply. The first entry
# is mandatory and MUST be "0001_initial" — it references the per-reality
# skeleton shipped in cycle 5 (contracts/migrations/per_reality/0001_initial.up.sql).
#
# Schema (see internal/manifest/manifest.go):
#   version: 1                         — manifest schema version
#   migrations:                        — ordered, monotonically-increasing
#     - id: "<filename-stem>"          — matches per_reality/<id>.up.sql
#       version: <uint>                — strictly increasing
#       breaking: <bool>               — true ⇒ route through canary module
#       dependencies: [<id>, ...]      — must reference earlier ids
#       description: "<one-line>"      — for runbook + dashboards
#
# Locked decisions:
#   - Q-L1D-1 (OPEN_QUESTIONS_LOCKED.md line 38): V1 = doc-only manual rollback.
#     `breaking: true` triggers canary (1 reality first); a canary failure
#     halts the fan-out and surfaces the failure in reality_migration_audit
#     for SRE follow-up. NO auto-rollback in V1.
#   - Q-L2-2: events partition strategy = monthly. Lands in cycle 8 as
#     0002_events_partitioning (NOT shipped here — only declared as the
#     reserved next slot).

version: 1

migrations:
  - id: "0001_initial"
    version: 1
    breaking: false
    dependencies: []
    description: "per-reality skeleton (events / outbox / snapshots / projection_meta) — shipped RAID cycle 5"

  # ── L2 per-reality tables (RAID cycle 9 — L2.A + L2.B + L2.E)
  #
  # All three are `breaking: true` because they DROP the cycle-5 skeleton
  # tables (events / snapshots / outbox) and re-create them in their
  # production shape. The L1.D orchestrator routes breaking migrations
  # through a 1-reality canary first (Q-L1D-1) and halts fan-out on canary
  # failure — at V1 we are pre-launch so no rows exist; canary is a CI
  # smoke not a live-data risk.

  - id: "0002_events_table"
    version: 2
    breaking: true
    dependencies: ["0001_initial"]
    description: "L2 cycle 9 — events table production shape: monthly RANGE partition on recorded_at (Q-L2-2), lz4 on payload+metadata, audit_ref UUID pointer (Q-L2-3)"

  - id: "0003_event_audit_table"
    version: 3
    breaking: true
    dependencies: ["0002_events_table"]
    description: "L2 cycle 9 — event_audit table: monthly RANGE partition, lz4 on text+jsonb, event_ref UUID pointer (NOT FK; Q-L2-3); 30d non-flagged / 90d flagged retention"

  - id: "0004_aggregate_snapshots_table"
    version: 4
    breaking: true
    dependencies: ["0002_events_table"]
    description: "L2 cycle 9 — aggregate_snapshots table (replaces cycle-5 skeleton 'snapshots'): PK (reality_id, agg_type, agg_id, agg_version), OPT-IN per-aggregate policy via contracts/events/snapshot_policy.yaml"

  # ── L2 per-reality outbox (RAID cycle 10 — L2.C)
  #
  # NOT breaking: cycle-5 placeholder `outbox` was dropped by cycle 9's 0002
  # migration; this migration creates a NEW table `events_outbox` and never
  # touches user data (table is empty by construction at first apply).
  - id: "0005_events_outbox_table"
    version: 5
    breaking: false
    dependencies: ["0002_events_table"]
    description: "L2 cycle 10 — events_outbox table (L2.C): event_id UUID pointer (NOT FK; Q-L2-3 archive-cut), 2 partial indexes (pending + dead_letter), drained by L2.D publisher; same-TX with event append per Q-L1B-3."

  # ── L3 per-reality projection tables (RAID cycle 13 — L3.A + L3.K)
  #
  # 0006 ships the 10 L3.A projection tables (pc, npc, region, world_kv,
  # session_participants, npc_session_memory, npc_session_memory_embedding,
  # npc_pc_relationship, pc_inventory, pc_relationship). 0007 ships the
  # L3.K drift-state summary table + stale_projections view + 10-row seed.
  - id: "0006_projections"
    version: 6
    breaking: false
    dependencies: ["0001_initial"]
    description: "L3 cycle 13 — 10 L3.A projection tables (PC/NPC/region/world_kv/session) + VerificationMeta cols per Q-L3-4. npc_session_memory_embedding uses VECTOR(1536) when pgvector ext present (Q-L3I-1), BYTEA(1536*4) fallback otherwise (cycle 16 0008_pgvector_setup ALTERs to VECTOR(1536))."

  - id: "0007_drift_metadata"
    version: 7
    breaking: false
    dependencies: ["0006_projections"]
    description: "L3 cycle 13 — L3.K projection_drift_state summary table (PK=table_name, CHECK allowlist=10 L3.A tables) + stale_projections view; idempotent seed of 10 rows. Cycle 14 L3.E sampler + L3.F monthly check write here."

  # ── L3.I pgvector finalizer (RAID cycle 16 — L3.I)
  #
  # Three-part migration: (a) CREATE EXTENSION vector (idempotent), (b) ALTER
  # npc_session_memory_embedding.embedding BYTEA → VECTOR(1536) (conditional
  # — skips if cycle 13's path-A already created with VECTOR), (c) CREATE
  # HNSW INDEX (m=16, ef_construction=64). Closes the L3 layer.
  # ⚠ 0008 UNREGISTERED 2026-08-08 (`1b14-05`). It does `CREATE EXTENSION
  # vector`, and the shipped stack runs `postgres:18-alpine`, which does NOT
  # provide pgvector -- so once the provisioner began applying the whole
  # manifest (1b12-05) it died at migration 8 of 15 on every new reality.
  # That regression was introduced by the fix for 1b7gap-H1, and the claim
  # "Verified: the full 0001->0019 chain applies to a throwaway database"
  # below was FALSE: the chain smoke SKIPS 0008 and reports it as skipped,
  # which is exactly the fact the claim needed and did not carry.
  #
  # It joins 0009-0012, which are unregistered for the same family of
  # reasons -- the L3 projection/test harnesses apply them where the
  # extension exists. `scripts/migration-manifest-gate.py` holds the row and
  # its shrink rule forces this to be revisited: the moment 0008 is put back
  # in the manifest, the gate reds until the exclusion is deleted.
  #
  # ⚠ TRIGGER: an image that provides pgvector. Then re-register it here.

  - id: "0013_events_content_sha256"
    version: 13
    breaking: false
    dependencies: ["0002_events_table"]
    description: "L2.A Wave-3 W3.4 — events.content_sha256 CHAR(64) (nullable). Stored SHA-256 of the canonical jsonb text of jsonb_build_object(p:payload, m:metadata) — covers payload AND metadata — set at INSERT by both the dp-kernel append + the Go emit path via the identical SQL expression. PG is the single canonicalizer (Go≡Rust agree, no cross-lang JSON lib). PLAIN column (not generated) so a later payload/metadata UPDATE doesn't mask byte-rot; the ledger -check-checksum re-derives + compares. NULL pre-0013 rows skipped."

  # ── 0014–0019 REGISTERED 2026-08-08 (`1b7gap-H1`, found by a cold-start refuter)
  #
  # These six shipped over months and NONE of them was registered here, so the
  # orchestrator never applied any of them: `channels`, the writer lease, the
  # ruleset digest and both projection drops could not exist in a real
  # per-reality database. The note above tracks 0009–0012 as a known gap
  # (`D-MANIFEST-0009-0012-UNREGISTERED`) — and six more files drifted straight
  # past that row while it sat there, because a ROW is not a MECHANISM. The
  # mechanism is now `scripts/migration-manifest-gate.py`: every
  # `per_reality/*.up.sql` must have an entry here or a reasoned exclusion, and
  # the exclusion list must SHRINK.
  #
  # ⚠ This CHANGES WHAT THE ORCHESTRATOR APPLIES. That is the point — it was
  # applying an eight-month-old schema — but it is a deployment-affecting edit
  # and is called out rather than slipped in. Verified: the full 0001→0019 chain
  # applies to a throwaway database, each migration re-applies cleanly, and the
  # down chain reverses to an empty schema (`scripts/dp-migration-chain-smoke.py`).
  - id: "0014_channel_ordering"
    version: 14
    breaking: false
    dependencies: ["0002_events_table"]
    description: "DP-Ch13 channel ordering — events.channel_id/channel_event_id/writer_epoch/causal_refs + channel_writer_state (epoch fence, DB-authoritative allocator) + channel_event_index."

  - id: "0015_writer_lease_liveness"
    version: 15
    breaking: false
    dependencies: ["0014_channel_ordering"]
    description: "IMG-A2 — channel_writer_state.holder_id + lease_expires_at (nullable = unheld/claimable) + expiry index. Gives the writer lease LIVENESS; DP-A16's epoch fence already gave it safety."

  - id: "0016_events_ruleset_digest"
    version: 16
    breaking: false
    dependencies: ["0002_events_table"]
    description: "events.ruleset_digest — pins each event to the ruleset version that admitted it."

  - id: "0017_drop_pc_npc_projections"
    version: 17
    breaking: true
    dependencies: ["0006_projections"]
    description: "Drops the seven pc_*/npc_* projection tables. Every one had a projector, a rebuilder, a golden fixture, an oracle and a benchmark — and NO PRODUCER: every pc.created/npc.created in the tree was a fixture. DROP ... IF EXISTS, so it is safe whether or not 0006 ran."

  - id: "0018_drop_region_session_world_kv_projections"
    version: 18
    breaking: true
    dependencies: ["0006_projections"]
    description: "Drops region_projection / world_kv_projection / session_participants — the same no-producer finding as 0017, one sweep later. DROP ... IF EXISTS."

  - id: "0019_channels"
    version: 19
    breaking: false
    dependencies: []
    description: "DP-Ch2 channel registry, per reality (FLOW-9). id BIGINT per REC-103; composite (reality_id, id) per REC-105; cycles unrepresentable via a generated parent_depth in the parent FK (REC-106); DP-Ch31/33/34 lifecycle rules as triggers. References no other table, hence no dependencies."
