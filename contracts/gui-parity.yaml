# GUI-parity census — every LIVE write-tier MCP tool, and the manual path to the same effect
#
# WHY: owner, 2026-09-04 — "FE should have ability to help user fix llm weakness by edit manually
# on gui, so we avoid to ship feature that user cannot use and agent is dumb". A capability
# reachable ONLY through an unreliable agent is a capability that does not work.
#
# DENOMINATOR: 314 tools live on the federated catalog (matches ai-gateway's own log line);
# 118 are visibility=legacy and excluded (deprecated tools are dead); 196 live; of those
# 118 are tier A or W. That 118 is what this file must cover.
#
# VERDICTS
#   UI            a mounted control achieves the same effect by hand. route + testid REQUIRED.
#   UI_NO_TESTID  the control exists and is mounted but carries no data-testid, so the record
#                 cannot be machine-checked. P3 work: add the testid, then promote to UI.
#   NONE          no manual path. THE GAP THIS FILE EXISTS TO FIND.
#   AGENT_ONLY    deliberately no manual path — `reason:` is REQUIRED and is reviewed.
#   UNTRIAGED     not yet adjudicated. NOT a verdict; it is the absence of one, and it never
#                 counts toward parity.
#
# 🔴 A testid alone is not enough — the component must be MOUNTED. LOOM M9 shipped a Publish
# button gated on a scene status no UI could set; the control existed, nothing rendered it.
