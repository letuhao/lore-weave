# gitleaks configuration for LoreWeave foundation RAID execution
# Per RAID_WORKFLOW.md §13.6 B6
#
# Strategy: extend default rules; allowlist test-fixture placeholders.
# Real secrets ONLY in env vars (per CLAUDE.md "no hardcoded secrets").

title = "loreweave-foundation-raid"

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9\-_]{20,}'''
tags = ["key", "anthropic"]

[[rules]]
id = "loreweave-prod-postgres-url"
description = "Production Postgres URL"
regex = '''postgres(?:ql)?:\/\/[^\s'\"<>]+@(?:prod-postgres\.loreweave|prod\.loreweave\.app)[^\s'\"<>]+'''
tags = ["url", "loreweave", "prod"]

[allowlist]
description = "Allowlists for test fixtures + placeholders"
paths = [
  '''\.gitleaks\.toml''',
  '''docs/raid/cycle_briefs/.*\.md''',  # briefs may show example URLs
  '''docs/audit/findings-.*\.md''',     # adversary findings may quote patterns
  '''docs/plans/.*\.md''',              # plan docs may show example secrets in fenced blocks
  '''scripts/raid/test/.*''',           # test-only helpers may use fake creds
  '''services/mcp-public-gateway/test/.*''',  # public-MCP edge test fixtures (fake lw_pk_ keys)
]
regexes = [
  '''<REDACTED-FAKE-SECRET>''',
  '''test-only-not-a-real-token''',
  '''placeholder-[A-Za-z0-9_-]+''',
  '''postgres://test:test@localhost''',  # per-DPS isolated test stack (B2)
  '''minioadmin''',                       # MinIO default for B2 test stack
  '''sk-ant-FAKE-DEMO-[A-Z]+''',

  # ── 10 findings on PR #219, every one a false positive ────────────────────
  # Allowlisted as EXACT LITERALS rather than by path. A path entry for
  # `services/knowledge-gateway/test/` or `.claude/skills/` would blind the
  # scanner to a real secret committed there tomorrow; these three strings
  # cannot be anything but placeholders.
  #
  # The JWT secret three test files share. It is 37 characters that say what
  # they are, and the length exists only to clear a >=32 validation.
  # (services/knowledge-gateway/test/{grants,kal-cast,kal-state}.spec.ts)
  '''test_secret_at_least_32_chars_long_xx''',
  # The dev header in the isolated-stack runbook and its seeding script, shown
  # against `http://localhost:28216`. Documentation of a local call, not a
  # credential. (docs/dev/ISOLATED_STACK.md, infra/iso-seed.sh)
  '''dev_internal_token''',
  # 🔴 A SECURITY CHECKLIST'S OWN COUNTER-EXAMPLE. Line 339 of
  # `aif-security-checklist/SKILL.md` — replicated into five agent-config
  # directories — reads `const API_KEY = "sk_live_abc123";` under the heading
  # "❌ Secrets in code". The scanner was flagging the document that tells
  # people not to do this. Exact literal only: a broader `sk_live_` allowance
  # would let a real Stripe key through.
  '''sk_live_abc123''',

  # -- 2 further findings on PR #219, surfaced when the scan RANGE widened ------
  # 🔴 THESE WERE NOT NEW COMMITS. Two consecutive `pull_request` runs on this same
  # branch scanned DIFFERENT ranges -- the green one a narrow one, the red one 1,569
  # commits -- so the earlier greens were partial scans, not clean ones. Both findings
  # live in branch history (021550e46, 70315044c), which is also why editing the files
  # at HEAD cannot clear them: gitleaks reads the commit range, not the worktree.
  #
  # Exact literals, per this file's rule above: a path entry for `docs/eval/toolloop/`
  # would blind the scanner to a real credential captured in a recorded run tomorrow,
  # and those files are machine-written transcripts of live calls -- exactly where a
  # real secret could land by accident.
  #
  # 1. A composition CONFIRM token, captured inside a recorded HTTP 400 error against
  #    `http://localhost:8217`. Not a credential: it is issued by a LOCAL dev server, a
  #    confirm token is single-use and short-lived, and this copy is TRUNCATED -- the
  #    base64 decodes to JSON that ends mid-string at char 118, because the error text
  #    cut the URL. It cannot be replayed anywhere, least of all against anything of
  #    the owner's. (docs/eval/toolloop/2026-08-14/idem-authoring6.json)
  '''eyJkIjoiY29tcG9zaXRpb24uYXV0aG9yaW5nX3J1bl9nYXRlIiwiZXhwIjoxNzg3NDY2MDA2LCJwIjp7ImJvb2tfaWQiOiIwMWEwMmQzZC05M2YyLTdmYmEtYWViNC04ZGQyYTM3Mjk1NWIiLCJydW5faWQiOiIwMWEwMmQzZC05Nzk2LTc4MTEt''',
  # 2. NOT A KEY AT ALL -- two model UUIDs in explanatory PROSE. The ledger note reads
  #    "post-fix the confirm token carries llm_model=<uuid> and embedding_model=<uuid>,
  #    both real ids obtained from settings_list_models". `generic-api-key` matched
  #    `llm_model=` followed by 36 characters. A model id is a public identifier the
  #    catalogue hands out. (contracts/frontend-journey-ledger.json)
  '''019eeb08-8be3-78fb-86c0-3b1eda7e0457''',
  '''019eeb08-8bff-75cb-8e86-700efd4033b5''',
]
stopwords = [
  "loreweave-fake",
]
