name: domain-db-smoke

# WHY THIS EXISTS (Track B completeness audit, 2026-07-11).
# book-service + glossary-service carry a large body of DB-backed round-trip tests
# (entity CRUD + delete, known-entities status/paging, canon reads, world/map
# authoring, reading-position) that are GATED on BOOK_TEST_DATABASE_URL /
# GLOSSARY_TEST_DB_URL and SKIP when unset. No CI anywhere set those vars, so ~384
# glossary + ~66 book behavioral tests were "green by skip", not green by proof — a
# whole class of flagship behavior went unverified while the suite reported success.
# This job spins an ephemeral Postgres, creates the two throwaway databases, and runs
# each service's api suite WITH the env set, so the round-trips actually execute in CI.
#
# Notes:
#  - Image is postgres:18-alpine to match dev — the schemas depend on PG18's built-in
#    uuidv7() default. A pg16 image would fail migration ("function uuidv7() does not
#    exist").
#  - Both harnesses self-apply their schema (book: migrate.Up; glossary: runMigrations),
#    so the job only needs empty databases — no migration files to mount.
#  - NOT a shared dev DB: each run gets a fresh container, so the tests may TRUNCATE /
#    seed freely (avoids the "shared dev DB is dirty" hazard).
#  - Path-filtered: only runs when one of these services (or this workflow) changes.

on:
  push:
    branches: ["**"]
    paths:
      - "services/book-service/**"
      - "services/glossary-service/**"
      - "services/admin-cli/**"
      - "services/meta-worker/**"
      - "services/breach-notifier/**"
      - "services/meta-outbox-relay/**"
      - "sdks/go/piikms/**"
      - "sdks/go/metaoutbox/**"
      - "sdks/go/metapg/**"
      - "services/auth-service/**"
      - "services/provider-registry-service/**"
      - "services/usage-billing-service/**"
      - "services/scheduler-service/**"
      - "migrations/meta/**"
      - ".github/workflows/domain-db-smoke.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "services/book-service/**"
      - "services/glossary-service/**"
      - "services/admin-cli/**"
      - "services/meta-worker/**"
      - "services/breach-notifier/**"
      - "services/meta-outbox-relay/**"
      - "sdks/go/piikms/**"
      - "sdks/go/metaoutbox/**"
      - "sdks/go/metapg/**"
      - "services/auth-service/**"
      - "services/provider-registry-service/**"
      - "services/usage-billing-service/**"
      - "services/scheduler-service/**"
      - "migrations/meta/**"
      - ".github/workflows/domain-db-smoke.yml"

permissions:
  contents: read

jobs:
  db-smoke:
    name: Domain DB round-trips (book + glossary)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: loreweave
          POSTGRES_PASSWORD: loreweave_dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loreweave -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      # Throwaway DB names MUST carry a test marker (…_test). The DB-gated tests run
      # destructive setup/cleanup and now REFUSE any DB whose name lacks a throwaway
      # marker (internal/testsafe), so a *_TEST_DATABASE_URL accidentally pointed at a
      # real service DB (loreweave_book) can never again wipe production data. Do NOT
      # use the bare production name here — it would (correctly) be refused by the guard.
      - name: create throwaway book + glossary databases
        env:
          PGPASSWORD: loreweave_dev
        run: |
          set -euo pipefail
          for db in loreweave_book_test loreweave_glossary_test; do
            psql -h localhost -p 5432 -U loreweave -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db;"
          done
      - name: book-service DB round-trips
        env:
          BOOK_TEST_DATABASE_URL: postgres://loreweave:loreweave_dev@localhost:5432/loreweave_book_test?sslmode=disable
        run: go -C services/book-service test ./internal/api/... -count=1
      - name: glossary-service DB round-trips
        env:
          GLOSSARY_TEST_DB_URL: postgres://loreweave:loreweave_dev@localhost:5432/loreweave_glossary_test?sslmode=disable
        run: go -C services/glossary-service test ./internal/api/... -count=1

  # ── meta / PII-KMS family (added 2026-07-31) ────────────────────────────────
  # SAME class of gap as the book+glossary one above, found by auditing which skipped
  # suites any workflow actually runs. 28 Go tests across 6 modules are gated on
  # PIIKMS_TEST_PG_URL, and **no workflow set it** — so they compiled (the foundation-ci
  # `go test ./...` module loop covers them) and then skipped, every run, forever.
  #
  # What was skipping: PgKEKManager (key-encryption-key destroy/shred/co-tenant
  # suppression), PII erasure live, admin-cli erasure/archive/migration-status/
  # projection-drift, meta-worker's user_erased writer, breach-notifier's store +
  # handler, and the meta-outbox relay's drain/prune. Encryption-key handling, GDPR
  # erasure and breach notification — the least acceptable surface in the repo to be
  # "green by skip".
  #
  # Their first real execution found one defect (a FIFO-drain test that assumed a fixed
  # LIMIT would contain its own seeded rows; it does not once sibling suites leave
  # pending rows in the shared throwaway DB — D-METAOUTBOX-DRAIN-TEST-ISOLATION).
  #
  # One database for the whole family on purpose: they SHARE `PIIKMS_TEST_PG_URL` by
  # design (the piikms/metaoutbox harnesses cross-apply each other's schema), and running
  # them together is what surfaced the isolation bug a per-module DB would have hidden.
  meta-db-smoke:
    name: Meta + PII-KMS DB round-trips
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: loreweave
          POSTGRES_PASSWORD: loreweave_dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loreweave -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      # Throwaway marker required, same rule as the job above.
      - name: create throwaway meta database
        env:
          PGPASSWORD: loreweave_dev
        run: |
          set -euo pipefail
          psql -h localhost -p 5432 -U loreweave -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE loreweave_piikms_test;"
      # The harnesses self-apply their DDL (migrations/meta/*.up.sql read at runtime),
      # so an empty database is enough. `-count=1` because a contract/SQL-only edit
      # leaves the test binary unchanged and would otherwise hit go test's cache.
      - name: meta + PII-KMS DB round-trips
        env:
          PIIKMS_TEST_PG_URL: postgres://loreweave:loreweave_dev@localhost:5432/loreweave_piikms_test?sslmode=disable
        run: |
          set -euo pipefail
          fail=0
          for dir in sdks/go/piikms sdks/go/metaoutbox services/admin-cli \
                     services/meta-worker services/breach-notifier services/meta-outbox-relay; do
            echo "::group::$dir"
            if ! go -C "$dir" test ./... -count=1; then
              echo "::error::meta db-smoke failed: $dir"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  # ── ROT-1: the eight DSN vars the first sweep missed (added 2026-07-31) ─────
  # ROT-0 wired `meta-db-smoke` after finding 41 never-executed tests — and reported "41"
  # because it swept only the two variables it happened to be looking at. Sweeping EVERY
  # `*_TEST_*` DSN in Go tests against EVERY workflow afterwards found eight more that no
  # workflow set, covering **159 further test functions that had never run anywhere**:
  # provider-registry 54 (BYOK credentials, catalog, pricing), usage-billing 37, auth 36,
  # incident-bot 12, scheduler 8, admin-cli 6, metapg 3, piikms-KMS 3.
  #
  # First execution found three reds, and — unlike ROT-0's — all three were STALE TESTS,
  # not product bugs. That distinction only exists because they were triaged instead of
  # assumed:
  #   · admin-cli: the hand-listed migration set omitted 032, the migration that adds
  #     'started' to the result_kind CHECK and whose own comment says it exists for this
  #     test. The test could never have passed.
  #   · scheduler: `recordSuccess` gained an `AND locked_by = $4` lease guard after the
  #     test was written; the test never claimed the row, so the UPDATE matched zero rows
  #     and the guard WORKING correctly read as the re-arm being broken.
  #   · usage-billing: the free-tier assertion asked for $8 against an owner DAILY cap of
  #     $10 with $3 already spent, so it 402'd on a limit unrelated to the free tier.
  #
  # Each service gets its OWN throwaway database: unlike the piikms family these suites do
  # not share a harness, and isolating them keeps a failure attributable.
  rot1-db-smoke:
    name: Auth · provider-registry · billing · scheduler DB round-trips
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: loreweave
          POSTGRES_PASSWORD: loreweave_dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loreweave -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: create throwaway databases
        env:
          PGPASSWORD: loreweave_dev
        run: |
          set -euo pipefail
          for db in loreweave_auth_test loreweave_provreg_test loreweave_usagebilling_test                     loreweave_scheduler_rot1_test loreweave_admincli_test loreweave_metapg_test; do
            psql -h localhost -p 5432 -U loreweave -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db;"
          done
      - name: ROT-1 DB round-trips
        env:
          AUTH_TEST_PG_URL: postgres://loreweave:loreweave_dev@localhost:5432/loreweave_auth_test?sslmode=disable
          TEST_PROVIDER_REGISTRY_DB_URL: postgres://loreweave:loreweave_dev@localhost:5432/loreweave_provreg_test?sslmode=disable
          USAGE_BILLING_TEST_DB_URL: postgres://loreweave:loreweave_dev@localhost:5432/loreweave_usagebilling_test?sslmode=disable
          SCHEDULER_TEST_DB_URL: postgres://loreweave:loreweave_dev@localhost:5432/loreweave_scheduler_rot1_test?sslmode=disable
          ADMINCLI_TEST_PG_URL: postgres://loreweave:loreweave_dev@localhost:5432/loreweave_admincli_test?sslmode=disable
          METAPG_TEST_PG_URL: postgres://loreweave:loreweave_dev@localhost:5432/loreweave_metapg_test?sslmode=disable
          INCIDENT_TEST_REDIS_URL: redis://localhost:6379/9
        run: |
          set -euo pipefail
          fail=0
          for dir in services/auth-service services/provider-registry-service                      services/usage-billing-service services/scheduler-service                      services/admin-cli services/breach-notifier sdks/go/metapg; do
            echo "::group::$dir"
            if ! go -C "$dir" test ./... -count=1; then
              echo "::error::rot1 db-smoke failed: $dir"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
