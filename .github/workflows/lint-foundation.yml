# .github/workflows/lint-foundation.yml — L1.K.16
#
# Wires the 15 foundation lints (L1.K.1–L1.K.15) into PR check.
# Q-L1K-1 LOCKED: mix — semgrep for cross-language patterns, shell+grep for
# simple, go vet for Go-specific. V1 ships all-shell since semgrep adds infra
# overhead; semgrep upgrades land per-lint in a follow-on cycle as patterns
# mature.
#
# Each lint runs in parallel via matrix. Total wall-clock target ≤ 3 min
# (per L1.K acceptance).

name: lint-foundation

on:
  pull_request:
    branches: [main, mmo-rpg/foundation-mega-task]
  push:
    branches: [main]

jobs:
  lint:
    name: ${{ matrix.lint }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        lint:
          - meta-write-discipline-lint
          - pii-classify-lint
          - transitions-validation-lint
          - shard-allocation-validation
          - migration-idempotency-validator
          - observability-inventory-lint
          - capacity-budget-lint
          - dep-pinning-lint
          - timeout-discipline-lint
          - language-rule-lint
          - role-grant-validator
          - outbox-event-emit-lint
          - service-acl-matrix-lint
          - prompt-assembly-discipline-lint
          - meta-sensitive-read-bypass-lint
          - read-audit-query-type-drift-lint
          # W3.3 — lifecycle-bound actor fixtures must use UUIDs (the
          # lifecycle_transition_audit.actor_id column is UUID NOT NULL). The
          # script's default mode runs its --selftest bite THEN the lint.
          - meta-actor-uuid-lint
          # W3.4 follow-up — an own-baseline `wg -emit` drill must apply migration
          # 0013 (the emit path stamps events.content_sha256). Default mode runs
          # its --selftest bite THEN the lint.
          - emit-migration-0013-lint
    steps:
      - uses: actions/checkout@v7
      - name: Run ${{ matrix.lint }}
        run: bash scripts/${{ matrix.lint }}.sh

  # P1 security/quality lints (audit P1) — now BLOCKING. Each carries a baseline/
  # allowlist (seeded from today's known offenders) so it passes on current code and
  # fails only on a NEW violation; the baselines are clean, so these are flipped off
  # `continue-on-error` to give the standards teeth (audit P1: "flip advisory →
  # blocking once the baseline is clean"). These are Python scripts
  # (`python scripts/<name>.py`), so they get their own job rather than the
  # `bash scripts/<name>.sh` matrix above. NOTE: `timeout-discipline-lint` is already
  # a BLOCKING leg in the matrix above (its Python extension WARNs internally — the
  # asyncpg-pool `command_timeout` debt is tracked in SESSION_HANDOFF), so it is
  # intentionally not duplicated here.
  p1-lints:
    name: P1 ${{ matrix.lint }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        lint:
          - pagination-cap-lint
          - blocking-in-async-lint
          - raw-sql-lint
          - injection-coverage-lint
          - language-bias-gate
          - sdk-duplication-gate
          - slo-latency-lint
          # CP-1 / M2 — the agent-runtime membrane. ARCHITECTURE §3 forbids a CODE
          # PATH from the legacy catalog to the new surface, not merely a wrong
          # result: "old declarations are not hidden, they are ABSENT". A
          # behavioural test can only show the path was not taken on the inputs it
          # tried, and "invisibility implemented as a filter" has leaked or
          # silently deleted the wrong thing thirteen times in this repository.
          # So the new package may import the standard library, itself, and what is
          # named in ALLOWED_EXTERNAL with a reason — an ALLOWLIST, because a
          # denylist is default-permitted and a legacy module written tomorrow
          # would be reachable until someone remembered it. CP-2.1 added the first
          # entry, `pydantic_ai`, SCOPED to assembly.py: P4 Assembly is a BUY
          # decision, and the gate additionally refuses the toolset library's two
          # CEILING apis (`.filtered`, `.prepared`), which delete a declaration
          # instead of deferring it. Its default mode runs --selftest, which fires
          # the gate on eleven bypass shapes — and stays silent on two negative
          # controls — before it is trusted to pass.
          - agentruntime-membrane-gate
          # Context Budget Law §13c — the §11a Inspector coverage manifest stays
          # un-gameable: every checklist item must bind to an existing proving test.
          # Static (no suite execution); the referenced tests' green-ness is enforced
          # by the normal vitest/pytest CI jobs, and the §13d refute-pass is the net
          # for a gutted test that a static check can't see.
          - context-inspector-checklist-gate
          # Track A / M9a — the central C-TOOL tier gate. The shared kit's ValidateToolMeta
          # checks a tool's tier is VALID (R|A|W|S) but not that it MATCHES the tool — so a
          # WRITE tool mis-tagged Tier-R (auto-runs, no confirm/Undo) passed every per-service
          # test. This asserts, across ALL services, that every write-verb-named tool carries a
          # non-R tier. Stdlib-only; also wired into the pre-commit hook so it runs on EVERY
          # branch's every commit (the byte-compile-only Python CI job never ran the tier tests).
          - tier-tag-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # slo-latency-lint parses YAML; the others are stdlib-only. Installing here is
      # a fast no-op for the stdlib lints and keeps the single shared step simple.
      - name: Install lint deps
        run: python -m pip install --quiet pyyaml
      - name: Run ${{ matrix.lint }}
        run: python scripts/${{ matrix.lint }}.py

  # CP-1 — the REFUSAL CENSUS. It is NOT in the lint matrix above, and that is
  # deliberate: those lints are stdlib-only and the shared step installs `pyyaml`
  # and nothing else, while this one RUNS THE SUITE 68 times. Put in the matrix it
  # would either fail on a missing pytest or — far worse — pass over a suite that
  # never ran, which is the vacuous-green shape this whole effort exists to end.
  #
  # Why it exists: twelve rounds of independent verification on CP-1 produced no
  # convergence — findings introduced per round read 2,1,2,1,3,2,4,3,2,2,2,5, with
  # the maximum on the SMALLEST delta of the run. The decisive evidence was
  # structural rather than numeric: a verifier stopped reporting a defect and WROTE
  # the patch, measured it at baseline and named the line; it was applied verbatim
  # and still shipped a regression. **When the pre-written fix still fails, the loop
  # is not limited by the quality of its findings.**
  #
  # Exactly one measurement in that run converged. Three verifiers independently
  # AST-enumerated the package's `raise` sites, agreed on 68, and agreed member for
  # member on which thirteen are unguarded. Two of them added a hand-picked
  # structural addendum (87 and 92 sites) and no two cut it the same way — every
  # unit of divergence lived there. So the reproducible half is mechanised and the
  # addendum is dropped, on their advice.
  #
  # What it changes: "a finding is closed" stops meaning "the builder wrote a test"
  # and starts meaning "this named site moved SILENT → RED". That structurally
  # forbids the run's most-repeated failure — a fix landing on the SIBLING of the
  # site a verifier named, seven times — because the sibling has its own id and its
  # own row in the allowlist.
  #
  # What it does NOT do: it cannot tell whether a guard is RIGHT, only whether the
  # suite notices the check is gone. A test that reds for the wrong reason still
  # reads RED here. That remains the verdicts' job.
  agentruntime-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 🔴 `requirements.txt` HAS NO PYTEST, so the first version of this job could never
      # pass: a verifier executed it and got `SELFTEST FAIL`, rc=1, every time. I wired a gate whose
      # green state was unreachable and did not run it in its CI shape before shipping it — which is
      # the vacuous-gate failure this job exists to prevent, committed in the job that prevents it.
      - name: Install chat-service deps
        working-directory: services/chat-service
        run: python -m pip install --quiet -r requirements.txt -r requirements-test.txt
      # Default mode runs --selftest first: it asserts the enumeration still finds
      # the sites AND that neutering a guarded refusal reds the suite, so CI cannot
      # pass a census that has not been shown to fire in both directions.
      - name: Refusal census
        run: python scripts/agentruntime-census.py

  # 🔴 THE GUARDS, NOT THE FIXES, ARE WHERE THIS RUN'S DEFECTS NOW LIVE.
  #
  # Six independent verification rounds on CP-1 converged on one shape: the fixes land, and the
  # guards written for them have holes. Round 26's ten findings were ALL guards — a control that
  # could not fail, a column that reddened for a different clause than the one it tested, an
  # anti-vacuity check calibrated below the thing it guarded. Sibling pairs fixed at both ends
  # across the run: 3 of 12.
  #
  # The rule "a fix without a red-able test is not a closed finding" was in force the whole time and
  # did not hold, because it is a thing a person is supposed to remember at the moment they are most
  # convinced they have just fixed something. What DID hold is the reversion prover: it caught four
  # fixes shipped with no guard at all in one round, before either verifier saw the tree.
  #
  # `--run` applies each recorded falsifier in a throwaway mirror and requires the guard it NAMES to
  # be the failing test — a red somewhere else is a bystander, which is the R26 finding this clause
  # is built from. ~2 minutes; it reuses one mirror rather than one per falsifier.
  agentruntime-falsification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install chat-service deps
        working-directory: services/chat-service
        run: python -m pip install --quiet -r requirements.txt -r requirements-test.txt
      # Default mode checks the PARTITION — every guard is falsified, deliberately unfalsifiable
      # with a reason, or in the checked-in backlog. `--run` then proves the recorded ones fire.
      - name: Falsification gate
        run: python scripts/agentruntime-falsification.py --run
