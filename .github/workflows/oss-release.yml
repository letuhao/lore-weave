# oss-release.yml — cut a versioned release: enforce the changelog SSOT, build + push per-
# service Docker images, publish the GitHub Release.
#
# WHY THE CHANGELOG CHECK IS ITS OWN JOB, FIRST, BLOCKING EVERYTHING ELSE. "The changelog is
# the source of truth for what shipped" is only true if nothing can ship without it. Building
# 41 images before checking is possible, but it means every one of those pushes has to be
# treated as provisional if the changelog check then fails — cheaper to fail in ~10s before any
# image is built than to publish first and hope. See scripts/changelog-gate.py for what
# "RELEASE MODE" actually checks; this workflow is just the thing that calls it at the moment
# that matters.
#
# TRIGGER: pushing a tag shaped `vX.Y.Z` (or `vX.Y.Z-<prerelease>`, e.g. `v0.2.0-rc.1`). The
# `/oss-publish` skill is what creates and pushes that tag after moving the relevant
# `[Unreleased]` entries into a dated CHANGELOG.md section and committing that — this workflow
# never writes to CHANGELOG.md itself, it only refuses to proceed if that step was skipped.
#
# PRE-RELEASE VS RELEASE — the one brand distinction this repo asked for — is read straight off
# the tag: a SemVer pre-release identifier (anything after a `-` in the version core, per
# https://semver.org/spec/v2.0.0.html#spec-item-9) marks it a GitHub "pre-release" and skips
# moving the `:latest` image tag, so `docker pull loreweave/x:latest` never lands on
# unfinished work. Plain `vX.Y.Z` is a full release: gets `:latest` too.

name: oss-release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push images to ghcr.io

concurrency:
  group: oss-release-${{ github.ref }}
  cancel-in-progress: false   # a release publishing images is not something to cancel mid-flight

jobs:
  validate-changelog:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: CHANGELOG.md names this exact version (the SSOT gate)
        run: python scripts/changelog-gate.py --release "${{ steps.version.outputs.version }}"

  compute-targets:
    needs: validate-changelog
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: targets
        run: |
          MATRIX="$(python scripts/oss/release-targets.py)"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: [validate-changelog, compute-targets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.compute-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build + push ${{ matrix.target.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.target.service }}:v${{ needs.validate-changelog.outputs.version }}
            ${{ needs.validate-changelog.outputs.is_prerelease == 'false' && format('ghcr.io/{0}/{1}:latest', github.repository_owner, matrix.target.service) || '' }}
          cache-from: type=gha,scope=${{ matrix.target.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.service }}

  github-release:
    needs: [validate-changelog, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: extract this version's changelog section as release notes
        run: |
          python scripts/changelog-gate.py --print-section "${{ needs.validate-changelog.outputs.version }}" > /tmp/release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: "v${{ needs.validate-changelog.outputs.version }}"
          body_path: /tmp/release-notes.md
          prerelease: ${{ needs.validate-changelog.outputs.is_prerelease }}
