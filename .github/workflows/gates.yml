# gates.yml — run EVERY gate in scripts/, discovered rather than listed.
#
# WHY THIS FILE EXISTS. A 2026-07-29 audit first reported "26 of 58 gates run
# nowhere". That number was WRONG — lint-foundation.yml wires its lints as
# matrices of BARE NAMES, which a path-only search missed. The true figure was 3.
#
# The real finding was worse than unwired, and CI had been saying so: SIX legs of
# lint-foundation had been failing on MAIN since at least 2026-07-26 —
# raw-sql-lint, injection-coverage-lint, language-bias-gate, pagination-cap-lint,
# dep-pinning-lint, capacity-budget-lint. Not advisory: `continue-on-error`
# survives in that file only as a comment recording its deliberate removal. The
# gates ran, blocked, reported — and six consecutive red runs were ignored.
#
# A gate nobody runs is not a gate. A red gate nobody acts on is worse: it
# teaches everyone to ignore the colour. `--run-all` + KNOWN_RED is the answer —
# every failure is fixed or carries a tracked deferral BY NAME, and a KNOWN_RED
# row that turns green FAILS, so the list shrinks instead of becoming normal.
#
# THE SHAPE MATTERS. This job does NOT enumerate gates. It calls
# `gate-wiring-gate.py --run-all`, which iterates the same filename predicate the
# wiring check uses — so a gate added tomorrow runs here the day it lands, with
# nobody remembering to edit this file. Listing names would have reproduced the
# original defect one level up: a list is default-uncovered.
#
# KNOWN_RED rows inside that script carry a tracked deferral id and are expected
# to fail. The run ALSO fails if a KNOWN_RED gate turns green, so the list
# shrinks when the debt is paid instead of quietly becoming permanent — the same
# discipline file-ceiling-gate applies to allowlisted line counts.
#
# NOT HERE: gates needing a live stack (postgres, built binaries). `--run-all`
# SKIPS those and prints the reason on every run; they want a stack-up job, and
# their absence is tracked (D-META-LIVE-SMOKE-NOT-IN-CI,
# D-PUBLISHER-SMOKE-NOT-IN-CI) rather than left as a silent hole.

name: gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Several gates diff against the previous commit or scan history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # SEVEN gates need PyYAML and this job never installed it. Measured on run
      # 31778713548: `authorable-surface-gate`, `generation-guard-gate`,
      # `slo-latency-lint`, `live-suite-registry-gate` and three `test_*` gates
      # all RED, four of them as a bare `Traceback`. They are GREEN on a dev box
      # because a dev box has it — which is the worst version of this: the local
      # sweep says 91 GREEN and CI says otherwise, and the sweep is the one that
      # is wrong. The gates read YAML SoT files (`contracts/**.yaml`); the
      # dependency is real, not incidental.
      - name: install the gates' Python dependencies
        run: python -m pip install --quiet pyyaml

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      # This job installed NOTHING, and eleven gates were reported FAILED for it.
      # Nine of those eleven were the runner discovering an absent import, not a gate
      # finding a defect: `generation-guard-gate` and `slo-latency-lint` print
      # "PyYAML is required" and exit non-zero, and the six `scripts/test_*.py` gates
      # (the meta-gates that prove the other gates can fail) `import pytest` at module
      # scope. All nine pass locally. That is the worst possible shape for a gate suite
      # — a wall of red whose cause is the runner, which is precisely how a suite stops
      # being read. Keep this list minimal and NAME why each entry is here: the job is
      # deliberately the one WITHOUT a live stack (see the header), so anything needing
      # a database or a built binary still does not belong in it.
      #   pyyaml — contracts/*.yaml parsers in several gates
      #   pytest — the six meta-gates are pytest modules, run directly by the runner
      - name: gate script dependencies
        run: python -m pip install --upgrade pip && python -m pip install pyyaml pytest

      # The registry has to be honest before its verdicts mean anything: the
      # scope is still a predicate, every exemption carries a reason, every
      # KNOWN_RED row names a deferral, and this runner is wired.
      - name: gate registry self-test
        run: python scripts/gate-wiring-gate.py --self-test

      # Is anything unwired? With the runner below in place this is total by
      # construction, so a failure here means the runner was removed.
      - name: gate wiring
        run: python scripts/gate-wiring-gate.py

      - name: run every gate
        run: python scripts/gate-wiring-gate.py --run-all

      # ...and every gate's OWN self-test, which `--run-all` does not reach: it
      # invokes each gate with NO ARGUMENTS, so it exercises normal mode only.
      # A review measured the consequence — the non-vacuity cases these gates
      # cite as proof that "every rule bites" ran nowhere automatically, so
      # deleting a case, or one silently starting to fail, reddened nothing.
      # The pre-commit hook runs this too; CI is what covers a `--no-verify`.
      #
      # Discovered, never enumerated: the first remedy named three gates and
      # reached three of sixteen.
      - name: every gate's self-test
        run: python scripts/gate-self-tests.py

      # ...and a self-test's claim that "every rule bites" is a claim like any
      # other. This mutates each gate's production rules one at a time and
      # requires the self-test to go RED. It has found a survivor in every round
      # since it was written, including in its own fixes.
      #
      # `--no-cargo` STRIPS the toolchain from the child's environment rather
      # than assuming this image lacks one. The previous version of this step
      # asserted "this runner has no Rust toolchain", which is verified by
      # nothing and is false on `ubuntu-latest` — so its timing justification was
      # void, and the sibling claim that "CI checks it" would have been the
      # false branch. The harness now decides the condition. Measured under it:
      # every gate mutation red in well under a minute.
      #
      # NOT in the pre-commit hook: with a toolchain present it takes ~11
      # minutes, essentially all of it `cargo test` inside the figures gate's
      # self-test.
      - name: every gate's rules, mutated
        run: python scripts/gate-bite-harness.py --no-cargo

  # The Rust half is a SEPARATE job because it needs the opposite environment:
  # it mutates `crates/actor-hub` in place and asserts that a named test reds,
  # so it requires a toolchain rather than the absence of one. It was built in
  # one round and wired in none — "defined, given a parameter, and never wired",
  # which is the defect that round's own commit message names.
  rust-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: crates/actor-hub, mutated
        run: python scripts/gate-bite-harness.py --rust

  # The reality layer's own guards, mutated (W3 + W5).
  #
  # SEPARATE from `rust-mutations` because it needs BOTH toolchains: the Go half
  # mutates `admin reality provision` and the Rust half mutates
  # `orphan_scan::classify`.
  #
  # Wired because it was not. A cold-start review of the W3 commit pointed out
  # that `scripts/reality-layer-bite-harness.py` appeared in no workflow, hook or
  # Makefile target — so it proved its ten guards load-bearing exactly once, on
  # the author's machine, and constrained nothing afterwards. That is the same
  # defect `gate-bite-harness.py`'s own header records ("the script existed only
  # in a session scratchpad"), repeated by someone who had just read it.
  reality-layer-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: reality-layer guards, mutated
        run: python scripts/reality-layer-bite-harness.py

  # DP-R3 across the workspace (`2F`) — the custom clippy lint, plus the ratchet
  # that makes its verdict binding.
  #
  # ITS OWN JOB, and the reason is a hard constraint rather than tidiness: this
  # lint is a dylint cdylib, which needs `rustc_private` and therefore a NIGHTLY
  # toolchain with rustc-dev. The workspace pins 1.89.0 STABLE on purpose —
  # `crates/dp/tests/ui/*.stderr` record rustc's diagnostic prose verbatim, so a
  # different rustc rewrites those files. The two toolchains must not meet, and
  # `lints/dp-clippy/` is outside the workspace with its own rust-toolchain.toml
  # for the same reason.
  #
  # `cargo-dylint`'s version must MATCH the `dylint_linting` the lint links.
  # 3.1.2 against 3.5.1 fails with `could not find RunCompiler in rustc_driver`
  # (the driver was compiled against a nightly whose API had moved), so the
  # version here is pinned to the dependency, not to "latest".
  dp-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-09-12
          components: rustc-dev, llvm-tools, rust-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            lints/dp-clippy

      - name: install cargo-dylint (version pinned to dylint_linting)
        run: |
          cargo install cargo-dylint --version 3.5.1 --locked
          cargo install dylint-link --version 3.5.1 --locked

      # FIRST, and deliberately: prove the lint fires, stays quiet on clean
      # code, exempts a crate carrying the dp-crate marker, and REDS on the
      # same crate without it. A workspace sweep by a lint that cannot fire is
      # the failure this repo has shipped repeatedly; the sweep below means
      # nothing until this step has passed.
      - name: the lint, proven non-vacuous
        run: cd lints/dp-clippy && ./run-lint.sh --self-test

      - name: DP-R3 across the workspace, ratcheted
        run: python scripts/dp-clippy-gate.py
