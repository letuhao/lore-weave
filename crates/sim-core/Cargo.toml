# sim-core — the simulation kernel (14_sim_core_spec.md, S1a slice).
#
# ZERO runtime dependencies, deliberately: determinism is the product, and
# every dependency is a determinism liability to audit. DetRng is a hand-rolled
# SplitMix64; time is injected as `Tick`, never read from a clock.
[package]
name = "sim-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]

[features]
# IAS-D3 — exposes `Admitted::unchecked` for kernel tests/benches that drive
# the scheduler with no rules pipeline. NEVER enable for a service binary:
# its absence is what makes an admission bypass a compile error.
test-util = []
