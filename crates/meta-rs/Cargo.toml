[package]
name = "meta-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Rust hot-path port of contracts/meta (Q-L1B-4) — full MetaWrite + AttemptStateTransition + caching + audit surface."

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
serde_yaml = "0.9"

# ── the `sqlx-pg` adapter (Q1 B2b) ──────────────────────────────────────────
# Optional: the crate stays driver-agnostic by default, and a caller that wants
# the concrete Postgres wiring opts in. `tokio` is needed for `block_in_place` —
# the sync MetaWrite traits over async sqlx.
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
sqlx-pg = ["dep:sqlx", "dep:tokio"]

[dev-dependencies]
tokio = { workspace = true }
