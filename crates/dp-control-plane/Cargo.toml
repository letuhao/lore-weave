[package]
name = "dp-control-plane"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "DP-C3 — the control plane's gRPC surface: tonic server and client generated from contracts/proto/dp_control_plane.proto."

# OUT OF `DP-R3`'s SCOPE — this crate is the CONTROL plane, not the data plane.
#
# `01_scope_and_boundary.md` §4 (LOCKED) scopes the rule by DATABASE: a
# game-layer crate reads or writes an aggregate in a PER-REALITY database. This
# crate opens no database at all. It serves the meta-backed control surface
# (reality routing, session/capability lifecycle) over gRPC, delegating every
# read and write to `meta-rs`, which is itself on the platform plane for the
# same reason.
[package.metadata.dp]
plane = "platform"
reason = "the control plane's transport — it opens no per-reality database and holds no aggregate; every read and write is delegated to meta-rs, which resolves routing for others rather than consuming it"

[lib]
path = "src/lib.rs"

[dependencies]
dp = { path = "../dp" }
meta-rs = { path = "../meta-rs", features = ["sqlx-pg"] }

tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
sqlx = { workspace = true }
