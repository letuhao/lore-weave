server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults to 1m; book-service accepts uploads up to 200MB
    # (maxImportSize/maxPdfPeekSize) — without this, any PDF/manuscript
    # import over 1MB 413s here before ever reaching the gateway.
    client_max_body_size 200M;

    # MIME types for ONNX/WASM files (VAD, AI models)
    location ~* \.mjs$ {
        types { } default_type application/javascript;
    }
    location ~* \.wasm$ {
        types { } default_type application/wasm;
    }

    # Proxy WebSocket connections to the api-gateway-bff
    location /ws {
        proxy_pass http://api-gateway-bff:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Proxy API calls to the api-gateway-bff
    location /v1/ {
        proxy_pass http://api-gateway-bff:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Proxy public MCP (external-agent entry) to the api-gateway-bff, which
    # forwards /mcp on to mcp-public-gateway internally. Without this block,
    # /mcp falls through to the SPA fallback below and 404s as index.html —
    # the single-port deployment (ngrok, etc.) can't reach MCP otherwise.
    location /mcp {
        proxy_pass http://api-gateway-bff:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Proxy grammar check to LanguageTool
    location /languagetool/ {
        proxy_pass http://languagetool:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Proxy browser-accessible MinIO object downloads (book covers, TTS/video
    # output, chat attachments) so a single-port deployment (e.g. ngrok) doesn't
    # need to expose MinIO's own port. Host header MUST pass through unchanged:
    # chat-service signs GET URLs with SigV4 against MINIO_EXTERNAL_URL's host,
    # and MinIO revalidates that signature against the Host it receives here.
    location /media/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # MED-8 single-domain — the game client under /game/ on THIS origin.
    #
    # Why it lives here and not on the gateway: this nginx is already the public
    # entry point (it fronts /v1, /ws, /mcp, /media), and ONE ORIGIN is the whole
    # requirement. localStorage is partitioned per origin, so serving the game on
    # its own host would give a user two separate sessions and two separate
    # language choices — the client code cannot fix that from either side.
    #
    # ⚠ The upstream is resolved through a VARIABLE, not a literal, and that is
    # load-bearing. `frontend-game` is gated behind the compose profiles
    # `game`/`full`, while THIS service has no profile and is always up. With a
    # literal `proxy_pass http://frontend-game:5174/`, nginx resolves the name at
    # CONFIG-LOAD time and aborts with "host not found in upstream" when the game
    # profile is off — i.e. a plain `docker compose up` would fail to start the
    # novel app's frontend entirely. Deferring DNS to request time turns that
    # into a 502 on /game/ only, leaving the rest of the app untouched.
    #
    # 127.0.0.11 is Docker's embedded DNS resolver.
    #
    # `rewrite ... break` strips the /game/ prefix (a variable proxy_pass cannot
    # carry a URI part to do it): frontend-game's own nginx serves assets from
    # root, while the bundle — built with VITE_BASE_PATH=/game/ — requests them
    # at /game/assets/*. Without the strip every asset 404s. Mirrored in dev by
    # frontend/vite.config.ts.
    location /game/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $game_upstream frontend-game:5174;
        rewrite ^/game/(.*)$ /$1 break;
        proxy_pass http://$game_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Bare /game → /game/ so the relative asset paths resolve.
    location = /game {
        return 301 /game/;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
