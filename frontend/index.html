<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA (M4): installable shell. iOS home-screen install needs these apple-* metas; a PNG
         apple-touch-icon is a tracked follow-on (needs a rasterized asset). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#141210" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LoreWeave" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Web fonts are loaded by src/lib/loadWebFonts.ts AFTER the load event (F15): a <link rel="stylesheet">
         here blocked `load`, so a font CDN that never answered hung every page. -->
    <title>LoreWeave</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
