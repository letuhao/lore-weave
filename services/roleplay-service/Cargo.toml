[package]
name = "roleplay-service"
version = "0.1.0-v1"
description = "LoreWeave roleplay-service (Rust) — scripts + actor-memory (charter/state) + start-orchestration; the MMO roleplay-service seed. v1 is lean: System + Per-user tiers, single platform pool, reuses chat-service for the turn loop / voice / debrief. Built on crates/service-http."
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# OUT OF `DP-R3`'s SCOPE — and this row is the ANSWER to `2E`, which was
# parked as "needs a PO decision" when it was answerable by looking.
#
# `01_scope_and_boundary.md` §4 (LOCKED) gives the test: does it read or write
# an aggregate in a per-reality database? Measured:
#
#   * `src/main.rs:17` — `service_http::db::init(&config.database_url,
#     sqlx::migrate!("./migrations"))`. That is the PLATFORM-PLANE per-service
#     bootstrap, with this service's own migrations.
#   * `reality_id` appears twice, and both are a foreign key in that platform
#     DB: a column in a SELECT list (`handlers/mod.rs:10`) and
#     `Option<Uuid>` on a model (`models.rs:32`). Neither routes to a
#     `reality_<id>` database.
#   * The package description above already said it: "single platform pool".
#
# So by a LOCKED rule this is not a game-layer service. If it ever opens a
# per-reality database, this row must go — that is the trigger.
[package.metadata.dp]
plane = "platform"
reason = "2E answered by measurement: single platform pool via service_http::db::init with its own migrations; reality_id is a foreign key in that platform DB (handlers/mod.rs:10, models.rs:32), not per-reality routing"

[[bin]]
name = "roleplay-service"
path = "src/main.rs"

[lib]
name = "roleplay_service"
path = "src/lib.rs"

[dependencies]
service-http = { path = "../../crates/service-http" }

tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# ACP A3 — produce the working-memory seed via typed contract structs, not hand-rolled JSON.
contracts-agent-control = { path = "../../crates/contracts-agent-control" }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
wiremock = { workspace = true }
serde_json = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
