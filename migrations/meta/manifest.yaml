# migrations/meta/manifest.yaml — the META (control-plane) migration manifest.
#
# WHY THIS DID NOT EXIST UNTIL 2026-08-08
# --------------------------------------
# `contracts/migrations/per_reality/` has had a manifest since RAID cycle 6, and
# `1b7gap-H1` measured what happens without one: six migrations shipped
# unregistered and the orchestrator applied an eight-month-old schema.
#
# The META tree is a SECOND migration tree, at repo root, holding 35 migrations —
# `reality_registry`, `instance_schema_migrations`, the lifecycle audit, the
# actor/control binding. It had **no manifest, no gate, and no runner**, and
# `loreweave_meta` does not exist in the dev stack at all. Every artifact that
# needs it (the provisioner's very first step writes `reality_registry` through
# the meta bridge) has therefore never run.
#
# `scripts/migration-manifest-gate.py` now covers BOTH trees, so a meta migration
# added tomorrow is registered by existing rather than by someone remembering.
#
# Generated from the tree on 2026-08-08 and then owned by hand: ids and order are
# the filenames, `breaking` is derived from whether the file DROPs, and
# `dependencies` are left empty because this tree has never declared any — an
# honest empty is better than an invented graph.

version: 1

migrations:
  - id: "001_reality_registry"
    version: 1
    breaking: false
    dependencies: []
    description: "meta — reality registry"

